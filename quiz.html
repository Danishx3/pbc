<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Ilmify || Quizzes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Join ilmify to explore Islamic knowledge through online quizzes.">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="pbc.css">
  <style>
    :root {
      --primary-color: #0d564f;
      --primary-light: #1a7a70;
      --bg-color: #00060f;
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-color: #4fd1c5;
      --correct-color: #10b981;
      --incorrect-color: #ef4444;
      --card-bg: rgba(13, 35, 30, 0.6);
      --card-border: rgba(79, 209, 197, 0.15);
      --accent-yellow: #f59e0b;
    }

    body.light-theme {
      background: radial-gradient(circle at 30% 30%, #f0fdfa 0%, #e2e8f0 100%) !important;
      background-color: #f1f5f9 !important;
      color: #1e293b !important;
      --bg-color: #f1f5f9;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --accent-color: #0d9488;
      --correct-color: #10b981;
      --incorrect-color: #ef4444;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(13, 148, 136, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'anek latin', sans-serif;
      background:
        radial-gradient(circle at 30% 30%, #0d564f, transparent 40%),
        radial-gradient(circle at 70% 40%, #0d564f, transparent 40%),
        radial-gradient(circle at 50% 70%, #0d564f, transparent 40%);
      background-color: #00060f;
      background-attachment: fixed;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(13, 86, 79, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
    }

    body.light-theme header {
      background: rgba(255, 255, 255, 0.8) !important;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03) !important;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    body.light-theme header h1 {
      color: #0f172a !important;
    }

    .home-btn {
      position: absolute;
      left: 20px;
      color: #ffffff;
      font-size: 1.2rem;
      transition: transform 0.2s, color 0.2s;
    }

    .home-btn:hover {
      transform: translateX(-3px);
      color: var(--accent-color);
    }

    body.light-theme .home-btn {
      color: #0f172a !important;
    }

    body.light-theme .home-btn:hover {
      color: #0d9488 !important;
    }

    /* Main Container */
    .container {
      flex: 1;
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      justify-content: center;
    }

    /* Cards */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.light-theme .glass-card {
      background: rgba(255, 255, 255, 0.95) !important;
      border: 1px solid rgba(13, 148, 136, 0.12) !important;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04) !important;
    }

    .welcome-section {
      text-align: center;
    }

    .welcome-section h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* Profile Avatar */
    .profile-avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .profile-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-light), var(--accent-color));
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(79, 209, 197, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s;
    }

    .profile-avatar:hover {
      transform: scale(1.05) rotate(5deg);
    }

    body.light-theme .profile-avatar {
      background: linear-gradient(135deg, #0d9488, #22d3ee);
      box-shadow: 0 8px 20px rgba(13, 148, 136, 0.2);
    }

    .score-badge {
      background: rgba(79, 209, 197, 0.1);
      border: 1px solid rgba(79, 209, 197, 0.2);
      color: var(--accent-color);
      padding: 6px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      display: inline-block;
      margin-bottom: 25px;
    }

    body.light-theme .score-badge {
      background: rgba(13, 148, 136, 0.08);
      border-color: rgba(13, 148, 136, 0.2);
    }

    /* Select Dropdown */
    .quiz-select-wrapper {
      position: relative;
      margin: 20px 0 10px 0;
    }

    select {
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-color);
      font-size: 1.05rem;
      font-weight: 500;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      outline: none;
      transition: all 0.3s;
    }

    select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    body.light-theme select {
      background: #ffffff;
      border-color: rgba(0, 0, 0, 0.1);
      color: #1e293b;
    }

    body.light-theme select:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
      background: #ffffff;
    }

    select option {
      background: #0d2823;
      color: #ffffff;
    }

    body.light-theme select option {
      background: #ffffff;
      color: #1e293b;
    }

    .quiz-select-wrapper::after {
      content: '\f107';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--accent-color);
    }

    /* Quiz Area */
    .question {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 25px;
      line-height: 1.45;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 20px;
      border-radius: 16px;
      color: var(--text-color);
      text-align: left;
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
      outline: none;
    }

    body.light-theme .option-btn {
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.06);
      color: #1e293b;
    }

    .option-letter {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.25s;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    body.light-theme .option-letter {
      background: rgba(0, 0, 0, 0.05);
      color: #0d9488;
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .option-text {
      flex: 1;
    }

    .option-btn:hover {
      background: rgba(79, 209, 197, 0.05);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .option-btn:hover .option-letter {
      background: var(--accent-color);
      color: #ffffff;
      border-color: transparent;
    }

    body.light-theme .option-btn:hover {
      background: rgba(13, 148, 136, 0.05);
      border-color: #0d9488;
    }

    body.light-theme .option-btn:hover .option-letter {
      background: #0d9488;
      color: #ffffff;
    }

    .option-btn:active {
      transform: translateY(0);
    }

    /* Option States */
    .option-btn.correct {
      background: rgba(16, 185, 129, 0.12) !important;
      border-color: var(--correct-color) !important;
      color: var(--correct-color) !important;
    }

    .option-btn.correct .option-letter {
      background: var(--correct-color) !important;
      color: #ffffff !important;
      border-color: transparent !important;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.12) !important;
      border-color: var(--incorrect-color) !important;
      color: var(--incorrect-color) !important;
    }

    .option-btn.wrong .option-letter {
      background: var(--incorrect-color) !important;
      color: #ffffff !important;
      border-color: transparent !important;
    }

    /* Timer & Progress */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .timer-badge {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: var(--accent-yellow);
      padding: 6px 14px;
      border-radius: 50px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
    }

    .timer-badge.low {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: var(--incorrect-color);
      animation: pulse 1s infinite;
    }

    .progress-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      margin-top: 25px;
      overflow: hidden;
    }

    body.light-theme .progress-track {
      background: rgba(0, 0, 0, 0.06);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-light), var(--accent-color));
      width: 0%;
      border-radius: 50px;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.light-theme .progress-fill {
      background: linear-gradient(90deg, #0d9488, #22d3ee);
    }

    /* Leaderboard */
    .leaderboard-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      transition: all 0.2s;
    }

    .leaderboard-item:hover {
      transform: translateX(4px);
      background: rgba(255, 255, 255, 0.06);
    }

    body.light-theme .leaderboard-item {
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    body.light-theme .leaderboard-item:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    .leaderboard-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rank-badge {
      font-size: 1.35rem;
      display: inline-block;
      min-width: 25px;
      text-align: center;
    }

    .rank-number {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      display: inline-block;
      min-width: 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      line-height: 22px;
    }

    body.light-theme .rank-number {
      background: rgba(0, 0, 0, 0.06);
    }

    .leaderboard-item .name {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .leaderboard-item .score {
      color: var(--accent-color);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .leaderboard-item.rank-row-1 {
      border-left: 4px solid var(--accent-yellow);
      background: rgba(245, 158, 11, 0.08);
      border-color: rgba(245, 158, 11, 0.2);
    }

    body.light-theme .leaderboard-item.rank-row-1 {
      background: rgba(245, 158, 11, 0.05);
      border-color: rgba(245, 158, 11, 0.2);
    }

    /* Score Pop Animation */
    #scoreChange {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 4.5rem;
      font-weight: 800;
      pointer-events: none;
      z-index: 1000;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .anim-plus {
      color: var(--correct-color);
      animation: popScore 0.8s ease-out forwards;
    }

    .anim-minus {
      color: var(--incorrect-color);
      animation: popScore 0.8s ease-out forwards;
    }

    @keyframes popScore {
      0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.25);
        opacity: 1;
      }

      100% {
        transform: translate(-50%, -80%) scale(1);
        opacity: 0;
      }
    }

    .btn-action {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
      color: #ffffff;
      border: none;
      padding: 15px 30px;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      box-shadow: 0 8px 20px rgba(13, 86, 79, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(13, 86, 79, 0.5);
    }

    .btn-action:active {
      transform: translateY(0);
    }

    body.light-theme .btn-action {
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      box-shadow: 0 8px 20px rgba(13, 148, 136, 0.25);
    }

    body.light-theme .btn-action:hover {
      box-shadow: 0 12px 25px rgba(13, 148, 136, 0.4);
    }

    /* Review Mode Styles */
    .review-question {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
    }

    body.light-theme .review-question {
      background: rgba(0, 0, 0, 0.01);
      border-color: rgba(0, 0, 0, 0.04);
    }

    .review-q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .review-q-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .review-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .review-badge-correct {
      background: rgba(16, 185, 129, 0.15);
      color: var(--correct-color);
    }

    .review-badge-incorrect {
      background: rgba(239, 68, 68, 0.15);
      color: var(--incorrect-color);
    }

    .review-q-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .review-ans-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
    }

    body.light-theme .review-ans-row {
      border-top-color: rgba(0, 0, 0, 0.05);
    }

    .review-ans-col {
      display: flex;
      align-items: baseline;
      font-size: 0.95rem;
    }

    .review-correct-val {
      color: var(--correct-color);
      font-weight: 700;
    }

    .review-user-val {
      font-weight: 700;
    }

    .review-user-val.correct {
      color: var(--correct-color);
    }

    .review-user-val.incorrect {
      color: var(--incorrect-color);
    }

    .review-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-right: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .share-btn {
      position: absolute;
      right: 20px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .share-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    body.light-theme .share-btn {
      color: #1e293b;
      background: rgba(0, 0, 0, 0.05);
      border-color: rgba(0, 0, 0, 0.05);
    }

    body.light-theme .share-btn:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    /* Guest Name Card Styles */
    .guest-card {
      text-align: center;
      padding: 15px 5px;
    }

    .guest-card .guest-icon {
      font-size: 3.5rem;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 10px rgba(79, 209, 197, 0.3));
    }

    .guest-card h2 {
      font-size: 1.65rem;
      margin-bottom: 10px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .guest-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .guest-name-input {
      width: 100%;
      padding: 15px 20px;
      font-size: 1.05rem;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-color);
      font-family: inherit;
      margin-bottom: 15px;
      outline: none;
      transition: all 0.3s;
    }

    .guest-name-input:focus {
      border-color: var(--accent-color);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.2);
    }

    body.light-theme .guest-name-input {
      background: #ffffff;
      border-color: rgba(0, 0, 0, 0.1);
      color: #1e293b;
    }

    body.light-theme .guest-name-input:focus {
      border-color: #0d9488;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }

    .guest-name-input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .guest-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .guest-divider::before,
    .guest-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
  <script src="/theme.js"></script>
</head>

<body>

  <header>
    <a href="/main.html" class="home-btn"><i class="fa fa-arrow-left"></i></a>
    <h1>Ilmify Quiz</h1>
    <button id="shareBtn" class="share-btn" onclick="shareQuiz()"><i class="fas fa-share-alt"></i></button>
  </header>

  <div class="container">

    <!-- Guest Name Entry Card (shown when not signed in) -->
    <div id="guestNameCard" class="glass-card" style="display:none;">
      <div class="guest-card">
        <div class="guest-icon">✏️</div>
        <h2>Welcome to Ilmify Quiz</h2>
        <p>Enter your name to participate in quizzes and appear on the leaderboard.</p>
        <input type="text" id="guestNameInput" class="guest-name-input" placeholder="Your name..." maxlength="30"
          onkeydown="if(event.key==='Enter') submitGuestName()">
        <button class="btn-action" onclick="submitGuestName()"><i class="fas fa-arrow-right" style="margin-right:8px;"></i>Continue</button>
        <div class="guest-divider">or</div>
        <a href="login.html" style="color:var(--accent-color); font-size:0.9rem; text-decoration:none;">
          <i class="fas fa-sign-in-alt" style="margin-right:6px;"></i>Sign in with your account
        </a>
      </div>
    </div>

    <!-- Welcome & Selection -->
    <div id="introCard" class="glass-card welcome-section" style="display:none;">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar" id="profileAvatar">U</div>
      </div>
      <h2 id="welcomeMessage">Welcome</h2>
      <div class="score-badge">Your Score: <span id="score">0</span></div>

      <div class="quiz-select-wrapper">
        <select id="quizSelector">
          <option disabled selected>Loading Quizzes...</option>
        </select>
      </div>

      <div id="leaderboardSection" style="display:none; margin-top: 30px; text-align:left;">
        <h3 style="margin-bottom:15px; color:#ddd;"><i class="fas fa-trophy" style="color:#ffd700;"></i> Leaderboard
          (Top 5)
        </h3>
        <ul id="leaderboardList" class="leaderboard-list"></ul>
      </div>
    </div>

    <!-- Active Quiz Card -->
    <div id="quizCard" class="glass-card" style="display:none;">
      <div class="quiz-header">
        <span>Question <span id="qIndex">1</span>/<span id="qTotal">10</span></span>
        <div class="timer-badge">
          <i class="far fa-clock"></i> <span id="timer">15</span>s
        </div>
      </div>

      <div class="question" id="questionText"></div>
      <div class="options-grid" id="answersGrid"></div>

      <div class="progress-track">
        <div id="progressBar" class="progress-fill"></div>
      </div>
    </div>

    <!-- Review Card -->
    <div id="reviewCard" class="glass-card" style="display:none;">
      <h2 style="margin-bottom:20px;">Review Quiz</h2>
      <div id="reviewContent"></div>
      <button class="btn-action" onclick="closeReview()">Back to Menu</button>
    </div>

  </div>

  <div id="scoreChange"></div>
  <audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

  <script>
    const auth = window.firebaseAuth || firebase.auth();
    const db = window.firebaseDb || firebase.database();

    let username = "", userId = "", selectedQuiz = "";
    let questions = [], current = 0, currentScore = 0;
    let timerInterval, timeLeft = 15;
    let quizTimerLimit = 15; // Default Timer Limit
    let userAnswers = []; // Store indices of selected answers

    // DOM Elements
    const quizSelector = document.getElementById('quizSelector');
    const introCard = document.getElementById('introCard');
    const quizCard = document.getElementById('quizCard');
    const reviewCard = document.getElementById('reviewCard');
    const questionText = document.getElementById('questionText');
    const answersGrid = document.getElementById('answersGrid');
    const timerEl = document.getElementById('timer');
    const progressBar = document.getElementById('progressBar');
    const scoreEl = document.getElementById('score');
    const scoreAnim = document.getElementById('scoreChange');
    const leaderboardList = document.getElementById('leaderboardList');
    const leaderboardSection = document.getElementById('leaderboardSection');

    const shareBtn = document.getElementById('shareBtn');

    function updateAvatarLetter(name) {
      const avatar = document.getElementById('profileAvatar');
      if (avatar && name) {
        // Strip any welcome prefixes if present
        let cleanName = name.replace(/^Welcome,\s+/i, '');
        avatar.textContent = cleanName.trim().charAt(0).toUpperCase();
      }
    }

    // Init — support both signed-in users and guests
    auth.onAuthStateChanged(user => {
      if (user) {
        // Admin redirect
        if (user.email === "piousbrotherscommunity@gmail.com") {
          window.location.href = "/admin/admin.html";
          return;
        }
        userId = user.uid;
        db.ref('users/' + userId).once('value').then(snap => {
          const data = snap.val() || {};
          username = data.username || user.displayName || "User";
          document.getElementById("welcomeMessage").innerText = "Welcome, " + username;
          updateAvatarLetter(username);
          document.getElementById('guestNameCard').style.display = 'none';
          introCard.style.display = 'block';
          loadQuizzes();
        });
      } else {
        // Not logged in — check for saved guest name
        const savedName = localStorage.getItem('ilmify_guest_name');
        if (savedName) {
          _applyGuestName(savedName);
        } else {
          document.getElementById('guestNameCard').style.display = 'block';
        }
      }
    });

    function submitGuestName() {
      const nameInput = document.getElementById('guestNameInput');
      const name = nameInput.value.trim();
      if (!name) {
        nameInput.focus();
        nameInput.style.borderColor = 'var(--incorrect-color)';
        return;
      }
      localStorage.setItem('ilmify_guest_name', name);
      _applyGuestName(name);
    }

    function _applyGuestName(name) {
      username = name;
      // Stable guest ID derived from name so scores persist across sessions
      userId = 'guest_' + name.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
      document.getElementById("welcomeMessage").innerText = "Welcome, " + name;
      updateAvatarLetter(name);
      document.getElementById('guestNameCard').style.display = 'none';
      introCard.style.display = 'block';
      loadQuizzes();
    }

    function loadQuizzes() {
      // First load Madeena exam IDs so we can hide them from the public list
      db.ref('madeena_exams').once('value', meSnap => {
        const madeenaIds = new Set();
        const meData = meSnap.val() || {};
        for (let k in meData) {
          if (meData[k].quizId) madeenaIds.add(meData[k].quizId);
        }

        db.ref('quizzes').once('value', snapshot => {
          const quizzes = snapshot.val() || {};
          quizSelector.innerHTML = `<option disabled selected value="">Select a Quiz to Start</option>`;
          for (let key in quizzes) {
            if (madeenaIds.has(key)) continue; // skip Madeena exam quizzes
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = key;
            quizSelector.appendChild(opt);
          }

          // Check for URL Param
          const urlParams = new URLSearchParams(window.location.search);
          const refQuiz = urlParams.get('quiz');
          if (refQuiz && quizzes[refQuiz] && !madeenaIds.has(refQuiz)) {
            quizSelector.value = refQuiz;
            selectedQuiz = refQuiz;
            loadLeaderboard(selectedQuiz);
            checkStatus();
            shareBtn.style.display = 'flex';
          }
        });
      });
    }

    quizSelector.addEventListener('change', () => {
      selectedQuiz = quizSelector.value;
      shareBtn.style.display = 'flex';
      loadLeaderboard(selectedQuiz);
      checkStatus();
    });

    function shareQuiz() {
      if (!selectedQuiz) return;
      const url = window.location.origin + window.location.pathname + '?quiz=' + encodeURIComponent(selectedQuiz);
      const title = "Take the " + selectedQuiz + " Quiz on Ilmify!";

      if (navigator.share) {
        navigator.share({
          title: title,
          text: "Challenge your knowledge with this quiz!",
          url: url
        }).catch(console.error);
      } else {
        navigator.clipboard.writeText(url).then(() => {
          alert("Link copied to clipboard!");
        });
      }
    }

    function checkStatus() {
      // Reset score display initially
      scoreEl.textContent = '0';

      db.ref('attempts/' + userId + '/' + selectedQuiz).once('value', snap => {
        if (snap.exists()) {
          const data = snap.val();

          // Update Score Display
          if (data && data.score !== undefined) {
            scoreEl.textContent = data.score;
          }

          // If detailed attempt data exists, allow review
          if (typeof data === 'object' || data === true) {
            const btn = document.createElement('button');
            btn.className = 'btn-action';
            btn.textContent = 'Review Previous Attempt';
            btn.onclick = () => loadReviewMode(data);

            // Clear existing review buttons if any
            const existingBtn = introCard.querySelector('.btn-action');
            if (existingBtn) existingBtn.remove();

            introCard.appendChild(btn);
          }
        } else {
          // Clean up review button
          const existingBtn = introCard.querySelector('.btn-action');
          if (existingBtn) existingBtn.remove();

          startQuiz();
        }
      });
    }

    function startQuiz() {
      db.ref('quizzes/' + selectedQuiz).once('value').then(snap => {
        const data = snap.val();
        if (!data || !data.questions) return alert("No questions found!");

        questions = data.questions;
        // Load custom timer from Firebase, default to 15 if not set
        quizTimerLimit = data.timerLimit || 15;

        current = 0;
        currentScore = 0;
        userAnswers = new Array(questions.length).fill(-1); // -1 means no answer

        introCard.style.display = 'none';
        reviewCard.style.display = 'none';
        quizCard.style.display = 'block';

        showQuestion();
      });
    }

    function showQuestion() {
      if (current >= questions.length) {
        finishQuiz();
        return;
      }

      const q = questions[current];
      questionText.textContent = q.q;
      document.getElementById('qIndex').textContent = current + 1;
      document.getElementById('qTotal').textContent = questions.length;

      answersGrid.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `
          <span class="option-letter">${letters[i] || (i + 1)}</span>
          <span class="option-text">${opt}</span>
        `;
        btn.onclick = () => checkAnswer(i);
        answersGrid.appendChild(btn);
      });

      resetTimer();
      updateProgressBar();
    }

    function checkAnswer(selectedIndex) {
      clearInterval(timerInterval);
      userAnswers[current] = selectedIndex;

      const correct = questions[current].correct;
      const opts = answersGrid.children;

      // Visual Feedback
      if (selectedIndex === correct) {
        opts[selectedIndex].classList.add('correct');
        animateScore(10);
        currentScore += 10;
      } else {
        opts[selectedIndex].classList.add('wrong');
        opts[correct].classList.add('correct');
        animateScore(-5);
        currentScore -= 5;
      }

      // Delay next question
      setTimeout(() => {
        current++;
        showQuestion();
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timeLeft = quizTimerLimit; // Use dynamic limit
      timerEl.textContent = timeLeft;

      const badge = document.querySelector('.timer-badge');
      if (badge) badge.classList.remove('low');

      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;

        if (badge && timeLeft <= 5) {
          badge.classList.add('low');
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          userAnswers[current] = -1; // Time out
          animateScore(-5);
          currentScore -= 5;
          current++;
          showQuestion();
        }
      }, 1000);
    }

    function updateProgressBar() {
      const percent = ((current) / questions.length) * 100;
      progressBar.style.width = percent + "%";
    }

    function animateScore(amount) {
      scoreEl.innerText = parseInt(scoreEl.innerText) + amount;

      scoreAnim.innerText = (amount > 0 ? '+' : '') + amount;
      scoreAnim.className = amount > 0 ? 'anim-plus' : 'anim-minus';

      // Remove class after anim to allow re-trigger
      setTimeout(() => {
        scoreAnim.className = '';
      }, 800);
    }

    function finishQuiz() {
      db.ref('scores/' + userId + '_' + selectedQuiz).set({
        username: username,
        score: currentScore,
        quiz: selectedQuiz,
        timestamp: Date.now()
      });

      // Save detailed attempt
      db.ref('attempts/' + userId + '/' + selectedQuiz).set({
        score: currentScore,
        answers: userAnswers,
        timestamp: Date.now()
      });

      alert(`Quiz Finished! Your score: ${currentScore}`);
      introCard.style.display = 'block';
      quizCard.style.display = 'none';

      loadLeaderboard(selectedQuiz);
      // Refresh status to show Review button
      checkStatus();
    }

    // --- Review Mode ---
    function loadReviewMode(attemptData) {
      // We need questions first
      db.ref('quizzes/' + selectedQuiz + '/questions').once('value').then(snap => {
        const qs = snap.val();
        const pastAnswers = attemptData.answers || []; // might be undefined for old records

        introCard.style.display = 'none';
        reviewCard.style.display = 'block';
        const container = document.getElementById('reviewContent');
        container.innerHTML = '';

        qs.forEach((q, idx) => {
          const userChoice = pastAnswers[idx];
          const isCorrect = userChoice === q.correct;
          const userChoiceText = userChoice >= 0 ? q.options[userChoice] : "Time Out / Skipped";

          const badgeText = isCorrect ? 'Correct' : (userChoice === -1 ? 'Timed Out' : 'Incorrect');
          const badgeClass = isCorrect ? 'review-badge-correct' : 'review-badge-incorrect';

          const div = document.createElement('div');
          div.className = 'review-question';
          div.innerHTML = `
                    <div class="review-q-header">
                        <span class="review-q-num">Question ${idx + 1}</span>
                        <span class="review-badge ${badgeClass}">${badgeText}</span>
                    </div>
                    <div class="review-q-text">${q.q}</div>
                    <div class="review-ans-row">
                        <div class="review-ans-col">
                            <span class="review-label">Correct:</span> 
                            <span class="review-correct-val">${q.options[q.correct]}</span>
                        </div>
                        ${attemptData.answers ? `
                        <div class="review-ans-col">
                            <span class="review-label">Your Answer:</span> 
                            <span class="review-user-val ${isCorrect ? 'correct' : 'incorrect'}">${userChoiceText}</span>
                        </div>` : ''}
                    </div>
                `;
          container.appendChild(div);
        });
      });
    }

    function closeReview() {
      reviewCard.style.display = 'none';
      introCard.style.display = 'block';
    }

    function loadLeaderboard(quizName) {
      leaderboardSection.style.display = 'block';
      db.ref('scores').once('value', snap => {
        const data = snap.val() || {};
        leaderboardList.innerHTML = '';

        const filtered = Object.values(data).filter(entry => entry.quiz === quizName);
        const sorted = filtered.sort((a, b) => b.score - a.score).slice(0, 5);

        if (sorted.length === 0) {
          leaderboardList.innerHTML = '<li style="color:var(--text-muted); text-align:center; padding: 20px 0;">No scores yet.</li>';
        } else {
          sorted.forEach((entry, idx) => {
            const rank = idx + 1;
            let badge = '';
            if (rank === 1) badge = '<span class="rank-badge">🥇</span>';
            else if (rank === 2) badge = '<span class="rank-badge">🥈</span>';
            else if (rank === 3) badge = '<span class="rank-badge">🥉</span>';
            else badge = `<span class="rank-number">${rank}</span>`;

            const li = document.createElement('li');
            li.className = `leaderboard-item rank-row-${rank}`;
            li.innerHTML = `
              <div class="leaderboard-left">
                ${badge}
                <span class="name">${entry.username}</span>
              </div>
              <span class="score">${entry.score} pts</span>
            `;
            leaderboardList.appendChild(li);
          });
        }
      });
    }
  </script>

  <script src="js/global-animations.js"></script>
</body>

</html>
