<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login to ILMIFY</title>
  <meta name="description"
    content="ilmify, Join Pious Brothers to explore Islamic knowledge through online quizzes, lessons, videos, and a growing Muslim learning community. 100% free and easy to access.">
  <meta name="keywords"
    content="ilmify, Islamic quiz, learn Islam, online Quran learning, Islamic education, Muslim community, Islamic website India, Pious Brothers, Islamic lessons, free Islamic resources">
  <meta name="author" content="ilmify Pious Brothers Team">

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(13, 86, 79, 0.3), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(26, 122, 112, 0.3), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(13, 86, 79, 0.2), transparent 60%);
      background-color: #00060f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* Animated background particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(175, 233, 218, 0.1);
      animation: float 20s infinite ease-in-out;
    }

    .particle:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .particle:nth-child(2) {
      width: 120px;
      height: 120px;
      top: 60%;
      right: 10%;
      animation-delay: 5s;
    }

    .particle:nth-child(3) {
      width: 60px;
      height: 60px;
      bottom: 20%;
      left: 20%;
      animation-delay: 10s;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) translateX(0);
        opacity: 0.3;
      }

      50% {
        transform: translateY(-50px) translateX(50px);
        opacity: 0.6;
      }
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 44px 36px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(13, 86, 79, 0.4);
      object-fit: cover;
    }

    h1 {
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.65);
      font-size: 14px;
      line-height: 1.5;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      animation: slideDown 0.3s ease-out;
      text-align: center;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert.show {
      display: block;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
    }

    /* Google Sign-In Button */
    .google-btn {
      width: 100%;
      padding: 14px 20px;
      background: #ffffff;
      border: none;
      border-radius: 12px;
      color: #1f2937;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .google-btn:hover {
      background: #f8fafc;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.18);
    }

    .google-btn:active {
      transform: translateY(0);
    }

    .google-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .google-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .google-btn .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(0, 0, 0, 0.2);
      border-top-color: #0d564f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .google-btn.loading .btn-text,
    .google-btn.loading .google-icon {
      display: none;
    }

    .google-btn.loading .spinner {
      display: block;
    }

    .divider {
      text-align: center;
      margin: 24px 0;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
    }

    .divider span {
      background: #06191b;
      padding: 0 16px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
      border-radius: 8px;
    }

    .guest-btn {
      width: 100%;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(175, 233, 218, 0.3);
      border-radius: 12px;
      color: #afe9da;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .guest-btn:hover {
      background: rgba(175, 233, 218, 0.1);
      border-color: #afe9da;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(175, 233, 218, 0.15);
    }

    .guest-btn:active {
      transform: translateY(0);
    }

    .security-note {
      margin-top: 24px;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .security-note i {
      color: #afe9da;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 22px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
  <script src="/theme.js"></script>
</head>

<body>
  <!-- Background particles -->
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="login-container">
    <div class="login-card">
      <!-- Logo Section -->
      <div class="logo-section">
        <div>
          <img class="logo-img" src="logoo.png" alt="ILMIFY Logo">
        </div>
        <h1>Welcome to ILMIFY</h1>
        <p class="subtitle">Sign in with your Google account to continue your learning journey</p>
      </div>

      <!-- Alert Message -->
      <div id="alertMessage" class="alert"></div>

      <!-- Google Sign In Button -->
      <button type="button" class="google-btn" id="googleBtn" onclick="signInWithGoogle()">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        <span class="btn-text">Sign in with Google</span>
        <div class="spinner"></div>
      </button>

      <div class="divider">
        <span>OR</span>
      </div>

      <!-- Guest Access -->
      <button type="button" class="guest-btn" onclick="continueAsGuest()">
        <i class="fas fa-user-circle"></i> Continue as Guest
      </button>

      <div class="security-note">
        <i class="fas fa-lock"></i>
        <span>Fast, secure authentication via Google</span>
      </div>
    </div>
  </div>

  <script>
    // Firebase is initialized in firebase-config.js
    const auth = window.firebaseAuth || firebase.auth();

    // Show alert message
    function showAlert(message, type = 'error') {
      const alertDiv = document.getElementById('alertMessage');
      alertDiv.textContent = message;
      alertDiv.className = `alert alert-${type} show`;

      setTimeout(() => {
        alertDiv.classList.remove('show');
      }, 5000);
    }

    let isSigningIn = false;

    // Google Sign-In Function
    async function signInWithGoogle() {
      if (isSigningIn) return;
      isSigningIn = true;

      const googleBtn = document.getElementById('googleBtn');
      googleBtn.classList.add('loading');
      googleBtn.disabled = true;

      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });

      try {
        const result = await auth.signInWithPopup(provider);
        const user = result.user;

        showAlert('Sign in successful! Redirecting...', 'success');

        // Sync or initialize user in Realtime Database
        try {
          const db = window.firebaseDb || firebase.database();
          const userRef = db.ref('users/' + user.uid);
          const snap = await userRef.once('value');
          const username = user.displayName || (user.email ? user.email.split('@')[0] : 'User');

          if (!snap.exists()) {
            await userRef.set({
              username: username,
              email: user.email || '',
              photoURL: user.photoURL || '',
              createdAt: Date.now(),
              lastLogin: Date.now()
            });
            // Increment registered users count
            db.ref('analytics/site/registeredUsers').transaction(count => (count || 0) + 1);
          } else {
            const data = snap.val() || {};
            const updates = { lastLogin: Date.now() };
            if (!data.username) {
              updates.username = username;
            }
            await userRef.update(updates);
          }
        } catch (dbError) {
          console.warn('Realtime database sync note:', dbError);
        }

        // Redirect logic
        const isAdmin = user.email === "piousbrotherscommunity@gmail.com";
        const returnUrl = localStorage.getItem('authReturnUrl');
        localStorage.removeItem('authReturnUrl');
        localStorage.removeItem('guestMode');

        setTimeout(() => {
          if (isAdmin) {
            window.location.href = "/admin/admin.html";
          } else if (returnUrl) {
            window.location.href = returnUrl;
          } else {
            window.location.href = "index.html";
          }
        }, 800);

      } catch (error) {
        isSigningIn = false;
        console.error('Google Sign-In Error:', error);
        googleBtn.classList.remove('loading');
        googleBtn.disabled = false;

        if (error.code === 'auth/popup-closed-by-user') {
          // User closed popup without signing in
          return;
        } else if (error.code === 'auth/popup-blocked') {
          showAlert('Sign-in popup was blocked by your browser. Please enable popups and try again.', 'error');
        } else if (error.code === 'auth/network-request-failed') {
          showAlert('Network error. Please check your internet connection.', 'error');
        } else {
          showAlert(error.message || 'Failed to sign in with Google. Please try again.', 'error');
        }
      }
    }

    // Continue as Guest function
    function continueAsGuest() {
      localStorage.setItem('guestMode', 'true');
      localStorage.setItem('guestStartTime', Date.now().toString());

      const returnUrl = localStorage.getItem('authReturnUrl');
      if (returnUrl) {
        localStorage.removeItem('authReturnUrl');
        window.location.href = returnUrl;
      } else {
        window.location.href = 'main.html';
      }
    }

    // Check auth status & messages on page load
    window.addEventListener('DOMContentLoaded', () => {
      const authMessage = localStorage.getItem('authMessage');
      if (authMessage) {
        showAlert(authMessage, 'error');
        localStorage.removeItem('authMessage');
      }

      // If user is already authenticated (and not in the middle of active sign in), redirect automatically
      auth.onAuthStateChanged(user => {
        if (isSigningIn) return; // Let signInWithGoogle handle the full sync
        if (user) {
          const isAdmin = user.email === "piousbrotherscommunity@gmail.com";
          const returnUrl = localStorage.getItem('authReturnUrl');
          if (returnUrl) {
            localStorage.removeItem('authReturnUrl');
            window.location.href = returnUrl;
          } else if (isAdmin) {
            window.location.href = "/admin/admin.html";
          } else {
            window.location.href = "index.html";
          }
        }
      });
    });
  </script>

  <script src="js/global-animations.js"></script>
</body>

</html>
