<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ilmify – Daily Adhkar & Dhikr</title>
  <meta name="description"
    content="ilmify-adhkars, Join ilmify to explore Islamic knowledge through online quizzes, lessons, videos, and a growing Muslim learning community. 100% free and easy to access.">
  <meta name="keywords"
    content="ilmify,adhkar, Islamic quiz, learn Islam, online Quran learning, Islamic education, Muslim community, Islamic website India, Pious Brothers, Islamic lessons, free Islamic resources">
  <meta name="author" content="ilmify || Pious Brothers Team">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Scheherazade+New:wght@400;700&family=Lateef:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Noto+Sans+Malayalam:wght@400;700&family=Anek+Latin:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="logoo.png" type="image/icon type">
  <link rel="stylesheet" href="pbc.css">

  <style>
    :root {
      --primary-color: #0d564f;
      --primary-hover: #1a7a70;
      --bg-dark: #00060f;
      --card-bg: rgba(13, 86, 79, 0.15);
      --text-main: #ffffff;
      --text-secondary: #b3b2b2;
      --accent: #ffd700;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Anek Latin', sans-serif;
      background:
        radial-gradient(circle at 30% 30%, #0d564f, transparent 40%),
        radial-gradient(circle at 70% 40%, #0d564f, transparent 40%),
        radial-gradient(circle at 50% 70%, #0d564f, transparent 40%);
      background-color: var(--bg-dark);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 120px;
    }

    .header-custom {
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border-bottom: 2px solid rgba(26, 122, 112, 0.5);
    }

    .header-custom .home-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-main);
      font-size: 1.3rem;
      text-decoration: none;
      transition: transform 0.3s;
    }

    .header-custom .home-btn:hover {
      transform: translateY(-50%) scale(1.1);
    }

    .header-custom h4 {
      margin: 0;
      font-weight: 700;
      color: var(--text-main);
    }

    .main-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
    }

    .time-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
      color: white;
      padding: 8px 20px;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(13, 86, 79, 0.4);
    }

    .progress-container {
      background: var(--card-bg);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
      border: 1px solid rgba(26, 122, 112, 0.3);
      backdrop-filter: blur(10px);
    }

    .progress-bar-custom {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-color), var(--primary-hover));
      border-radius: 10px;
      transition: width 0.5s ease;
      box-shadow: 0 0 10px rgba(26, 122, 112, 0.6);
    }

    .adhkar-card {
      background: linear-gradient(135deg, rgba(13, 86, 79, 0.2), rgba(26, 122, 112, 0.15));
      border-radius: 25px;
      padding: 35px;
      margin-bottom: 25px;
      border: 2px solid rgba(26, 122, 112, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      animation: fadeInUp 0.5s ease;
      flex: 1;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .adhkar-index {
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 1px;
    }

    .adhkar-text {
      font-family: var(--adhkar-font, 'Amiri', serif);
      font-size: var(--adhkar-size, 1.8rem);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 2.2;
      color: black;
      text-align: right;
      direction: rtl;
      background: rgb(255, 255, 255);
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .adhkar-malayalam {
      font-family: 'Noto Sans Malayalam', sans-serif;
      font-size: 1.1rem;
      line-height: 1.9;
      color: var(--text-secondary);
      padding: 20px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      border-top: 2px solid rgba(26, 122, 112, 0.5);
      margin-top: 20px;
      white-space: pre-wrap;
    }

    /* Bottom Navigation Bar — matches quran.html */
    .navigation-controls {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(0, 6, 15, 0.85), rgba(5, 5, 5, 0.36));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 15px 30px;
      z-index: 100;
      display: flex;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
    }

    .nav-btn {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Anek Latin', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(13, 86, 79, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(13, 86, 79, 0.4);
    }

    .nav-btn:active {
      transform: translateY(0);
    }

    .nav-btn:disabled {
      background: linear-gradient(135deg, #6c757d, #5a6268);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .nav-btn.auto-btn {
      background: linear-gradient(135deg, #28a745, #20c997);
    }

    .nav-btn.auto-btn.active {
      background: linear-gradient(135deg, #dc3545, #c82333);
    }

    .stats-container {
      display: flex;
      justify-content: space-around;
      margin-top: 25px;
      padding: 20px;
      background: var(--card-bg);
      border-radius: 15px;
      border: 1px solid rgba(26, 122, 112, 0.3);
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      display: block;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 5px;
    }

    .floating-actions {
      position: fixed;
      bottom: 85px;
      right: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 999;
    }

    .fab {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
      color: white;
      border: none;
      box-shadow: 0 4px 20px rgba(13, 86, 79, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: all 0.3s;
    }

    .fab:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(13, 86, 79, 0.7);
    }

    @media (max-width: 768px) {
      .main-container {
        padding: 20px 15px;
      }

      .adhkar-card {
        padding: 25px 20px;
      }

      .adhkar-text {
        padding: 20px;
      }

      .adhkar-malayalam {
        font-size: 1rem;
        padding: 15px;
      }

      .nav-btn {
        padding: 12px 18px;
        font-size: 0.9rem;
      }

      .floating-actions {
        bottom: 85px;
        right: 20px;
      }

      .fab {
        width: 50px;
        height: 50px;
        font-size: 1.1rem;
      }
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.7;
      }
    }

    /* Settings Modal Styles */
    :root {
      --adhkar-font: 'Amiri', serif;
      --adhkar-size: 1.8rem;
    }

    .settings-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      animation: fadeIn 0.3s ease;
    }

    .settings-content {
      background: linear-gradient(135deg, rgba(13, 86, 79, 0.95), rgba(0, 6, 15, 0.95));
      border: 1px solid rgba(26, 122, 112, 0.5);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .close-settings {
      position: absolute;
      right: 20px;
      top: 15px;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.3s;
    }

    .close-settings:hover {
      color: var(--accent);
    }

    .setting-group {
      margin-bottom: 25px;
    }

    .setting-group label {
      display: block;
      margin-bottom: 10px;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .form-select,
    .form-range {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      font-family: inherit;
      outline: none;
    }

    .form-select option {
      background: #00060f;
      color: white;
    }

    .form-select:focus,
    .form-range:focus {
      border-color: var(--primary-hover);
      box-shadow: 0 0 0 2px rgba(13, 86, 79, 0.3);
    }

    .font-preview {
      margin-top: 15px;
      text-align: center;
      font-size: var(--adhkar-size, 1.8rem);
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      direction: rtl;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
  <script src="guest-utils.js"></script>
</head>

<body>
  <header class="header-custom">
    <a class="home-btn" href="/main.html"><i class="fa fa-home"></i></a>
    <center id="pageTitle">
      Daily Adhkar
    </center>
    <button id="settingsBtn" title="Settings"
      style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1.4rem; cursor: pointer; color: white; z-index: 1001; transition: transform 0.3s;"
      onmouseover="this.style.transform='translateY(-50%) rotate(90deg)'"
      onmouseout="this.style.transform='translateY(-50%) rotate(0deg)'">
      <i class="fas fa-cog"></i>
    </button>
  </header>

  <div class="main-container">
    <div class="text-center mb-4">
      <span class="time-badge" id="timeBadge"></span>
    </div>

    <div class="progress-container">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span style="font-size: 0.9rem; color: var(--text-secondary);">Progress</span>
        <span id="progressText" style="font-weight: 600; color: var(--accent);">0 / 0</span>
      </div>
      <div class="progress-bar-custom">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <div class="adhkar-card">
      <div class="adhkar-index" id="adhkarIndex">Adhkar 1 of ...</div>
      <div class="adhkar-text" id="adhkarText"></div>
      <div class="adhkar-malayalam" id="adhkarMalayalam"></div>
    </div>

    <div class="navigation-controls">
      <button id="prevBtn" class="nav-btn">
        <i class="fas fa-arrow-left"></i>
        <span>Prev</span>
      </button>
      <button id="autoScrollBtn" class="nav-btn auto-btn">
        <i class="fas fa-play" id="autoIcon"></i>
        <span id="autoText">Auto</span>
      </button>
      <button id="nextBtn" class="nav-btn">
        <span>Next</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>

    <div class="stats-container">
      <div class="stat-item">
        <span class="stat-value" id="completedCount">0</span>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="remainingCount">0</span>
        <div class="stat-label">Remaining</div>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="totalCount">0</span>
        <div class="stat-label">Total</div>
      </div>
    </div>
  </div>

  <div class="floating-actions">
    <button class="fab" id="scrollTopBtn" title="Scroll to top" style="display: none;">
      <i class="fas fa-arrow-up"></i>
    </button>
  </div>

  <div id="settingsModal" class="settings-modal">
    <div class="settings-content">
      <span class="close-settings" id="closeSettings">&times;</span>
      <h4 class="mb-4" style="color: var(--accent); font-weight: 700;">Preferences</h4>

      <div class="setting-group">
        <label>Arabic Font Style</label>
        <select id="fontSelect" class="form-select">
          <option value="'Amiri', serif">Amiri</option>
          <option value="'Noto Naskh Arabic', serif">Noto Naskh (Default)</option>
          <option value="'Scheherazade New', serif">Scheherazade New</option>
          <option value="'Lateef', serif">Lateef</option>
          <option value="'IBM Plex Sans Arabic', sans-serif">IBM Plex Sans</option>
        </select>
      </div>

      <div class="setting-group">
        <label>Font Size</label>
        <input type="range" id="sizeRange" class="form-range" min="1.2" max="3.5" step="0.1" value="1.8">
      </div>

      <div class="font-preview" id="fontPreview">
        بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
      </div>

      <div class="text-center mt-4">
        <button id="resetSettings" class="btn-custom btn-sm"
          style="width: auto; padding: 8px 20px; font-size: 0.9rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">
          Reset Defaults
        </button>
      </div>
    </div>
  </div>

  <script>
        const adhkars = {
      morning: [
        {
          arabic: "Begin your day with remembrance\n\n      الْحَمْدُ لِلهِ وَحْدَهُ، وَالصَّلاَةُ وَالسَّلاَمُ عَلَى مَنْ لاَ نَبِيَّ بَعْدَهُ ",
          malayalam: "അല്ലാഹുവിനെ സ്മരിച്ചുകൊണ്ട് നിങ്ങളുടെ ദിവസം ആരംഭിക്കുക\n\n      അല്ലാഹുവിന് മാത്രമാകുന്നു സര്‍വ്വസ്തുതിയും. ആർക്കു ശേഷം മറ്റൊരു പ്രവാചകൻ ഇല്ലയോ അദ്ദേഹത്തിന്റെ മേൽ അല്ലാഹുവിന്റെ അനുഗ്രഹവും ശാന്തിയുമുണ്ടാകട്ടെ."
        },
        {
          arabic: "(1 time)\nاللهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ",
          malayalam: "(1 തവണ)\nഅല്ലാഹു- അവനല്ലാതെ ആരാധ്യനില്ല. അവന്‍ എന്നെന്നും ജീവിച്ചിരിക്കുന്നവനും എല്ലാം നിയന്ത്രിക്കുന്നവനുമാണ്. മയക്കമോ ഉറക്കമോ അവനെ ബാധിക്കുകയില്ല. ആകാശ ഭൂമികളിലുള്ളതെല്ലാം അവന്റേതാണ്. അവന്റെ അനുവാദമില്ലാതെ അവന്റെയടുക്കല്‍ ശുപാര്‍ശ ചെയ്യാന്‍ കഴിയുന്നവനാരുണ്ട്? അവരുടെ മുമ്പിലുള്ളതും പിന്നിലുള്ളതും അവന്‍ അറിയുന്നു. അവന്‍ ഇച്ഛിക്കുന്നതല്ലാതെ അവന്റെ അറിവില്‍നിന്ന് യാതൊന്നും അവര്‍ക്ക് ഗ്രഹിക്കാനാവില്ല. അവന്റെ കുര്‍സി (അധികാരപീഠം) ആകാശഭൂമികളെ മുഴുവന്‍ ഉള്‍ക്കൊള്ളുന്നതാകുന്നു. അവയുടെ സംരക്ഷണം അവന് ഒട്ടും ഭാരമുള്ളതല്ല. അവന്‍ ഉന്നതനും മഹാനുമത്രെ. (സൂറത്തുൽ ബഖറ: 255)"
        },
        {
          arabic: "(3 times)\n Al-Ikhlas,Al-Falaq, An-Nas",
          malayalam: "(3 തവണ വീതം)\n സൂറത്തുൽ ഇഖ്ലാസ്, സൂറത്തുൽ ഫലഖ്, സൂറത്തുന്നാസ് പാരായണം ചെയ്യുക"
        },
        {
          arabic: "(1 time)\n\n      أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلهِ ، وَالْحَمْدُ لِلهِ، لاَ إِلٰهَ إِلاَّ اللهُ وَحْدَهُ لاَ شَرِيكَ لَهُ ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذاَ الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ، وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وعَذَابٍ فِي الْقَبْرِ ",
          malayalam: "(1 തവണ)\n\n      ഞങ്ങള്‍ പ്രഭാതത്തില്‍ പ്രവേശിച്ചിരിക്കുന്നു. ഈ പ്രഭാതത്തില്‍ പരമാധികാരം അല്ലാഹുവിനാകുന്നു. സര്‍വ്വസ്തുതിയും അല്ലാഹുവിന് മാത്രമാണ്. അല്ലാഹുവല്ലാതെ മറ്റൊരു ആരാധ്യനുമില്ല. അവന്‍ ഏകനും പങ്കുകാരില്ലാത്തവനുമാണ്. പരമാധികാരവും സര്‍വ്വ സ്തുതിയും അവനാണ്. അവന്‍ എല്ലാ കാര്യങ്ങള്‍ക്കും കഴിവുള്ളവനാണ്. എന്റെ രക്ഷിതാവേ, ഈ ദിവസത്തിലുള്ള നന്മയും ഇതിനു ശേഷമുള്ള നന്മയും ഞാന്‍ നിന്നോട് ചോദിക്കുന്നു. ഈ ദിവസത്തിലുള്ള തിന്മയില്‍നിന്നും ഇതിനു ശേഷമുള്ള തിന്മയില്‍നിന്നും ഞാന്‍ നിന്നോട് രക്ഷതേടുന്നു. എന്റെ രക്ഷിതാവേ, അലസതയില്‍നിന്നും വാര്‍ധക്യത്തിന്റെ പ്രയാസങ്ങളില്‍നിന്നും ഞാന്‍ നിന്നോട് രക്ഷ തേടുന്നു. എന്റെ രക്ഷിതാവേ, നരകശിക്ഷയില്‍നിന്നും ഖബ്ർ ശിക്ഷയില്‍നിന്നും ഞാന്‍ നിന്നോട് രക്ഷതേടുന്നു."

        {
          arabic: "(1 time)\n\n      اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا ، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ",
          malayalam: "(1 തവണ)\n\n      അല്ലാഹുവേ, നിന്റെ അനുഗ്രഹത്താല്‍ ഞങ്ങള്‍ പ്രഭാതത്തില്‍ പ്രവേശിച്ചു. നിന്റെ അനുഗ്രഹത്താല്‍ ഞങ്ങള്‍ പ്രദോഷത്തിലും പ്രവേശിക്കുന്നു. നിന്റെ അനുഗ്രഹത്താല്‍ ഞങ്ങള്‍ ജീവിക്കുന്നു. നിന്റെ തീരുമാനപ്രകാരം ഞങ്ങള്‍ മരിക്കുകയും ചെയ്യുന്നു. നിങ്കലേക്ക് തന്നെയാണ് ഞങ്ങളുടെ മടക്കവും."
        },
        {
          arabic: "(1 time)\n\n      اللَّهُمَّ أَنْتَ رَبِّي لَا إِلٰهَ إلَّا أَنْتَ ، خَلَقْتَنِي وَأَنَا عَبْدُكَ ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَااسْتَطَعْتُ، أَعُوذُبِكَ مِنْ شَرِّ مَا صَنَعْتُ ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ لَكَ بِذَنْبي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ ",
          malayalam: "(1 തവണ)\n\n      അല്ലാഹുവേ, നീയാണെന്റെ രക്ഷിതാവ്. നീയല്ലാതെ മറ്റൊരു ആരാധ്യനില്ല. നീയെന്നെ സൃഷ്ടിച്ചു; ഞാന്‍ നിന്റെ അടിമയാണ്. എന്നാലാവും വിധം നിന്നോടുള്ള കരാറിലും നിന്റെ വാഗ്ദാനത്തിലും ഞാന്‍ നിലകൊള്ളുന്നു. ഞാന്‍ ചെയ്തുപോയ കാര്യങ്ങളുടെ തിന്മയില്‍നിന്നും ഞാന്‍ നിന്നോട് രക്ഷ തേടുന്നു. നീ എനിക്ക് ചെയ്തനുഗ്രഹിച്ച അനുഗ്രഹങ്ങള്‍ ഞാന്‍ സമ്മതിക്കുന്നു. എന്റെ പാപങ്ങളും ഞാന്‍ ഏറ്റുപറയുന്നു. അതിനാല്‍ എനിക്ക് നീ പൊറുത്തുതരേണമേ. നീയല്ലാതെ പാപങ്ങള്‍ പൊറുത്തുതരുന്ന മറ്റാരുമില്ല. ((സയ്യിദുൽ ഇസ്തിഗ്ഫാർ))"
        },
        {
          arabic: "(3 times)\n\n      اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لاَ إِلٰهَ إِلاَّ أَنْتَ. اللَّهُمَّ إِنِّـي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالْفَقْرِ، اللَّهُمَّ إِنِّـي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لاَ إِلٰهَ إِلاَّ أَنْتَ",
          malayalam: "(3 തവണ)\n\n      അല്ലാഹുവേ, എന്റെ ശരീരത്തിന് നീ സൗഖ്യം നല്‍കേണമേ, അല്ലാഹുവേ, എന്റെ കേള്‍വിക്ക് നീ സൗഖ്യം നല്‍കേണമേ, അല്ലാഹുവേ, എന്റെ കാഴ്ചക്ക് നീ സൗഖ്യം നല്‍കേണമേ. നീയല്ലാതെ മറ്റൊരു ആരാധ്യനില്ല. അല്ലാഹുവേ, അവിശ്വാസത്തില്‍നിന്നും ദാരിദ്ര്യത്തില്‍നിന്നും നിന്നോട് ഞാന്‍ രക്ഷതേടുന്നു. ഖബ്ർ ശിക്ഷയില്‍നിന്നും നിന്നോട് ഞാന്‍ രക്ഷ തേടുന്നു. നീയല്ലാതെ മറ്റൊരു ആരാധ്യനില്ല."
        },
        {
          arabic: "(1 time)\n\n      اللَّهُمَّ إِنِّـي أسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ في الدُّنْيَا وَالْآخِرَة، اللَّهُمَّ إِنِّـي أسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَينِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي ",
          malayalam: "(1 തവണ)\n\n      അല്ലാഹുവേ, ഇഹലോകത്തും പരലോകത്തും വിട്ടുവീഴ്ചയും സൗഖ്യവും നിന്നോട് ഞാന്‍ ചോദിക്കുന്നു. അല്ലാഹുവേ, എന്റെ മതത്തിലും ദുനിയാവിലും എന്റെ കുടുംബത്തിലും സമ്പത്തിലും വിട്ടുവീഴ്ചയും സൗഖ്യവും നിന്നോട് ഞാന്‍ ചോദിക്കുന്നു. അല്ലാഹുവേ, എന്റെ ന്യൂനതകള്‍ നീ മറച്ചുവെക്കുകയും, എന്റെ ഭയപ്പെടുത്തുന്ന അവസ്ഥകളില്‍ എനിക്ക് നീ നിര്‍ഭയത്വം നല്‍കുകയും ചെയ്യേണമേ. അല്ലാഹുവേ, എന്റെ മുന്നില്‍നിന്നും പിന്നില്‍നിന്നും വലത്തുനിന്നും ഇടത്തുനിന്നും മുകളില്‍നിന്നും എനിക്ക് നീ സംരക്ഷണം നല്‍കേണമേ. എന്റെ താഴെ നിന്ന് പെട്ടെന്നൊരപകടം വന്ന് ഞാന്‍ നശിച്ചുപോകുന്നതില്‍ നിന്റെ പവിത്രതകൊണ്ടു ഞാന്‍ രക്ഷതേടുന്നു."

        {
          arabic: "(1 time)\n\n      اللَّهُمَّ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ ، لَا إِلٰهَ إِلَّا أَنْتَ رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ ",
          malayalam: "(1 തവണ)\n\n      ആകാശങ്ങളുടെയും ഭൂമിയുടെയും സ്രഷ്ടാവേ, ദൃശ്യവും അദൃശ്യവും അറിയുന്നവനേ, നീയല്ലാതെ മറ്റൊരു ആരാധ്യനുമില്ല; എല്ലാ വസ്തുക്കളുടെയും റബ്ബും ഉടമസ്ഥനുമായ അല്ലാഹുവേ, എന്റെ മനസ്സിന്റെ തിന്മയില്‍നിന്നും പിശാചിന്റെ തിന്മയില്‍നിന്നും അവന്‍ (അല്ലാഹുവിന്) പങ്കുകാരെ ചേര്‍ക്കാന്‍ പ്രേരിപ്പിക്കുന്നതില്‍നിന്നും, ഞാന്‍ എനിക്കുതന്നെ ഒരു തിന്മ വരുത്തിവെക്കുകയോ അല്ലെങ്കില്‍ അതൊരു മുസ്ലിമിന്റെ മേല്‍ വലിച്ചിഴക്കുകയോ ചെയ്യുന്നതില്‍നിന്നും നിന്നോട് ഞാന്‍ രക്ഷ തേടുന്നു."

        {
          arabic: "(3 times)\n\n      بِسْمِ اللهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ ",
          malayalam: "(3 തവണ)\n\n      ഭൂമിയിലും ആകാശത്തുമുള്ള യാതൊന്നിനും യാതൊരു ഉപദ്രവവും ഏല്‍പിക്കാന്‍ കഴിയാത്തവിധം കാവല്‍ നല്‍കുന്ന അല്ലാഹുവിന്റെ നാമത്തില്‍. അവന്‍ എല്ലാം കേള്‍ക്കുന്നവനും അറിയുന്നവനുമത്രെ."

        {

          malayalam: "(3 തവണ)\n\n      അല്ലാഹുവിനെ റബ്ബായും, ഇസ്ലാമിനെ മതമായും, മുഹമ്മദ് നബിയെ (സ) പ്രവാചകനായും ഞാന്‍ തൃപ്തിപ്പെട്ടിരിക്കുന്നു."

        {
          arabic: "(1 time)\n\n      يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ ، أَصْلِحْ لِي شَأْنِي كُلَّهُ ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ ",
          malayalam: "(1 തവണ)\n\n      എന്നെന്നും ജീവിച്ചിരിക്കുന്നവനേ, എല്ലാറ്റിനെയും നിയന്ത്രിക്കുന്നവനേ, നിന്റെ കാരുണ്യം മുഖേന ഞാന്‍ നിന്നോട് സഹായം തേടുന്നു. എന്റെ എല്ലാ കാര്യങ്ങളും നീ നന്നാക്കിത്തരേണമേ. കണ്ണിമ വെട്ടുന്ന സമയം പോലും നീ എന്നെ എനിക്കുതന്നെ വിട്ടുതരാതിരിക്കുകയും ചെയ്യേണമേ."

          malayalam: "(1 തവണ)\n\n      അല്ലാഹുവേ, നീയാണെന്റെ രക്ഷിതാവ്. നീയല്ലാതെ മറ്റൊരു ആരാധ്യനില്ല. നീയെന്നെ സൃഷ്ടിച്ചു; ഞാന്‍ നിന്റെ അടിമയാണ്. എന്നാലാവും വിധം നിന്നോടുള്ള കരാറിലും നിന്റെ വാഗ്ദാനത്തിലും ഞാന്‍ നിലകൊള്ളുന്നു. ഞാന്‍ ചെയ്തുപോയ കാര്യങ്ങളുടെ തിന്മയില്‍നിന്നും ഞാന്‍ നിന്നോട് രക്ഷ തേടുന്നു. നീ എനിക്ക് ചെയ്തനുഗ്രഹിച്ച അനുഗ്രഹങ്ങള്‍ ഞാന്‍ സമ്മതിക്കുന്നു. എന്റെ പാപങ്ങളും ഞാന്‍ ഏറ്റുപറയുന്നു. അതിനാല്‍ എനിക്ക് നീ പൊറുത്തുതരേണമേ. നീയല്ലാതെ പാപങ്ങള്‍ പൊറുത്തുതരുന്ന മറ്റാരുമില്ല. ((സയ്യിദുൽ ഇസ്തിഗ്ഫാർ))"
        },
        {
          arabic: "(3 times)\n اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لاَ إِلٰهَ إِلاَّ أَنْتَ. اللَّهُمَّ إِنِّـي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالْفَقْرِ، اللَّهُمَّ إِنِّـي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لاَ إِلٰهَ إِلاَّ أَنْتَ",
          malayalam: "(3 തവണ)\n\n      അല്ലാഹുവേ, എന്റെ ശരീരത്തിന് നീ സൗഖ്യം നല്‍കേണമേ, അല്ലാഹുവേ, എന്റെ കേള്‍വിക്ക് നീ സൗഖ്യം നല്‍കേണമേ, അല്ലാഹുവേ, എന്റെ കാഴ്ചക്ക് നീ സൗഖ്യം നല്‍കേണമേ. നീയല്ലാതെ മറ്റൊരു ആരാധ്യനില്ല. അല്ലാഹുവേ, അവിശ്വാസത്തില്‍നിന്നും ദാരിദ്ര്യത്തില്‍നിന്നും നിന്നോട് ഞാന്‍ രക്ഷതേടുന്നു. ഖബ്ർ ശിക്ഷയില്‍നിന്നും നിന്നോട് ഞാന്‍ രക്ഷ തേടുന്നു. നീയല്ലാതെ മറ്റൊരു ആരാധ്യനില്ല."
        },
        {
          arabic: "(1 time)\n اللَّهُمَّ إِنِّـي أسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ في الدُّنْيَا وَالْآخِرَة، اللَّهُمَّ إِنِّـي أسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَينِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي ",
          malayalam: "(1 തവണ)\n\n      അല്ലാഹുവേ, ഇഹലോകത്തും പരലോകത്തും വിട്ടുവീഴ്ചയും സൗഖ്യവും നിന്നോട് ഞാന്‍ ചോദിക്കുന്നു. അല്ലാഹുവേ, എന്റെ മതത്തിലും ദുനിയാവിലും എന്റെ കുടുംബത്തിലും സമ്പത്തിലും വിട്ടുവീഴ്ചയും സൗഖ്യവും നിന്നോട് ഞാന്‍ ചോദിക്കുന്നു. അല്ലാഹുവേ, എന്റെ ന്യൂനതകള്‍ നീ മറച്ചുവെക്കുകയും, എന്റെ ഭയപ്പെടുത്തുന്ന അവസ്ഥകളില്‍ എനിക്ക് നീ നിര്‍ഭയത്വം നല്‍കുകയും ചെയ്യേണമേ. അല്ലാഹുവേ, എന്റെ മുന്നില്‍നിന്നും പിന്നില്‍നിന്നും വലത്തുനിന്നും ഇടത്തുനിന്നും മുകളില്‍നിന്നും എനിക്ക് നീ സംരക്ഷണം നല്‍കേണമേ. എന്റെ താഴെ നിന്ന് പെട്ടെന്നൊരപകടം വന്ന് ഞാന്‍ നശിച്ചുപോകുന്നതില്‍ നിന്റെ പവിത്രതകൊണ്ടു ഞാന്‍ രക്ഷതേടുന്നു."
        },
        {
          arabic: "(1 time)\n اللَّهُمَّ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ ، لَا إِلٰهَ إِلَّا أَنْتَ رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ ",
          malayalam: "(1 തവണ)\n\n      ആകാശങ്ങളുടെയും ഭൂമിയുടെയും സ്രഷ്ടാവേ, ദൃശ്യവും അദൃശ്യവും അറിയുന്നവനേ, നീയല്ലാതെ മറ്റൊരു ആരാധ്യനുമില്ല; എല്ലാ വസ്തുക്കളുടെയും റബ്ബും ഉടമസ്ഥനുമായ അല്ലാഹുവേ, എന്റെ മനസ്സിന്റെ തിന്മയില്‍നിന്നും പിശാചിന്റെ തിന്മയില്‍നിന്നും അവന്‍ (അല്ലാഹുവിന്) പങ്കുകാരെ ചേര്‍ക്കാന്‍ പ്രേരിപ്പിക്കുന്നതില്‍നിന്നും, ഞാന്‍ എനിക്കുതന്നെ ഒരു തിന്മ വരുത്തിവെക്കുകയോ അല്ലെങ്കില്‍ അതൊരു മുസ്ലിമിന്റെ മേല്‍ വലിച്ചിഴക്കുകയോ ചെയ്യുന്നതില്‍നിന്നും നിന്നോട് ഞാന്‍ രക്ഷ തേടുന്നു."
        },
        {
          arabic: "(3 times)\n بِسْمِ اللهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ ",
          malayalam: "(3 തവണ)\n\n      ഭൂമിയിലും ആകാശത്തുമുള്ള യാതൊന്നിനും യാതൊരു ഉപദ്രവവും ഏല്‍പിക്കാന്‍ കഴിയാത്തവിധം കാവല്‍ നല്‍കുന്ന അല്ലാഹുവിന്റെ നാമത്തില്‍. അവന്‍ എല്ലാം കേള്‍ക്കുന്നവനും അറിയുന്നവനുമത്രെ."
        },
        {
          arabic: "(1 time)\n يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ ، أَصْلِحْ لِي شَأْنِي كُلَّهُ ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ ",
          malayalam: "(1 തവണ)\n\n      എന്നെന്നും ജീവിച്ചിരിക്കുന്നവനേ, എല്ലാറ്റിനെയും നിയന്ത്രിക്കുന്നവനേ, നിന്റെ കാരുണ്യം മുഖേന ഞാന്‍ നിന്നോട് സഹായം തേടുന്നു. എന്റെ എല്ലാ കാര്യങ്ങളും നീ നന്നാക്കിത്തരേണമേ. കണ്ണിമ വെട്ടുന്ന സമയം പോലും നീ എന്നെ എനിക്കുതന്നെ വിട്ടുതരാതിരിക്കുകയും ചെയ്യേണമേ."

          malayalam: "(100 തവണ)\n\n      അല്ലാഹു എത്ര പരിശുദ്ധന്‍! സര്‍വ്വ സ്തുതിയും അവനാകുന്നു."

        {
          arabic: "(1 time)\nٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭ ۚ لَّهُۥ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ ",
          malayalam: "(1 തവണ)\n\n      അല്ലാഹു- അവനല്ലാതെ ആരാധ്യനില്ല. അവന്‍ എന്നെന്നും ജീവിച്ചിരിക്കുന്നവനും എല്ലാം നിയന്ത്രിക്കുന്നവനുമാണ്. മയക്കമോ ഉറക്കമോ അവനെ ബാധിക്കുകയില്ല. ആകാശ ഭൂമികളിലുള്ളതെല്ലാം അവന്റേതാണ്. അവന്റെ അനുവാദമില്ലാതെ അവന്റെയടുക്കല്‍ ശുപാര്‍ശ ചെയ്യാന്‍ കഴിയുന്നവനാരുണ്ട്? അവരുടെ മുമ്പിലുള്ളതും പിന്നിലുള്ളതും അവന്‍ അറിയുന്നു. അവന്‍ ഇച്ഛിക്കുന്നതല്ലാതെ അവന്റെ അറിവില്‍നിന്ന് യാതൊന്നും അവര്‍ക്ക് ഗ്രഹിക്കാനാവില്ല. അവന്റെ കുര്‍സി (അധികാരപീഠം) ആകാശഭൂമികളെ മുഴുവന്‍ ഉള്‍ക്കൊള്ളുന്നതാകുന്നു. അവയുടെ സംരക്ഷണം അവന് ഒട്ടും ഭാരമുള്ളതല്ല. അവന്‍ ഉന്നതനും മഹാനുമത്രെ. (സൂറത്തുൽ ബഖറ: 255)"
        },
        {
          arabic: "(1 time)\n ءامن الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّـهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ﴿٢٨٥﴾ لَا يُكَلِّفُ اللَّـهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ",
          malayalam: "(1 തവണ)\n\n      റസൂല്‍, തന്റെ റബ്ബിങ്കല്‍നിന്നു തനിക്ക് ഇറക്കപ്പെട്ടതില്‍ വിശ്വസിച്ചിരിക്കുന്നു; സത്യവിശ്വാസികളും. എല്ലാവരും അല്ലാഹുവിലും, അവന്‍റെ മലക്കുകളിലും, അവന്‍റെ ഗ്രന്ഥങ്ങളിലും, അവന്‍റെ റസൂലുകളിലും വിശ്വസിച്ചിരിക്കുന്നു. 'അവന്‍റെ റസൂലുകളില്‍ ഒരാള്‍ക്കിടയിലും ഞങ്ങള്‍ വ്യത്യാസം കല്‍പിക്കുന്നില്ല.' അവര്‍ പറയുകയും ചെയ്തു: 'ഞങ്ങള്‍ കേള്‍ക്കുകയും, ഞങ്ങള്‍ അനുസരിക്കുകയും ചെയ്തിരിക്കുന്നു. ഞങ്ങളുടെ റബ്ബേ, നിന്‍റെ പാപമോചനത്തിനായ്! നിങ്കലേക്ക് തന്നെയാണ് മടക്കം.' അല്ലാഹു ഒരാളോടും അയാളുടെ കഴിവിലുപരിയായി ശാസിക്കുകയില്ല. അയാള്‍ പ്രവര്‍ത്തിച്ചു നേടിയത് അയാള്‍ക്കു തന്നെ; അയാള്‍ പ്രവര്‍ത്തിച്ചുണ്ടാക്കിയതിന്‍റെ ഭവിഷ്യത്തും അയാളുടെ മേല്‍ തന്നെ. 'ഞങ്ങളുടെ റബ്ബേ, ഞങ്ങള്‍ മറന്നുപോകുകയോ ഞങ്ങള്‍ക്ക് അബദ്ധം പിണയുകയോ ചെയ്തുവെങ്കില്‍ നീ ഞങ്ങളെ പിടികൂടരുതേ. ഞങ്ങളുടെ റബ്ബേ, ഞങ്ങള്‍ക്കുമുമ്പുള്ളവരുടെമേല്‍ നീ ചുമത്തിയതുപോലെ ഭാരമുള്ള ബാധ്യത നീ ഞങ്ങളുടെമേല്‍ ചുമത്തരുതേ. ഞങ്ങളുടെ റബ്ബേ, ഞങ്ങള്‍ക്ക് കഴിവില്ലാത്തത് നീ ഞങ്ങളെ വഹിപ്പിക്കരുതേ. ഞങ്ങള്‍ക്ക് നീ മാപ്പുതരികയും, ഞങ്ങള്‍ക്ക് പൊറുത്തുതരികയും, ഞങ്ങളോട് കരുണ കാണിക്കുകയും ചെയ്യേണമേ. നീയാണ് ഞങ്ങളുടെ രക്ഷാധികാരി. ആകയാല്‍ അവിശ്വാസികളായ ജനവിഭാഗത്തിനെതിരെ നീ ഞങ്ങളെ സഹായിക്കേണമേ.' (സൂറത്തുൽ ബഖറ: 285-286)"
        },
        {
          arabic: "(1 time)\n بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي وَبِكَ أَرْفَعُهُ إِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ ",
          malayalam: "(1 തവണ)\n\n      എന്റെ രക്ഷിതാവേ, നിന്റെ നാമത്തില്‍ ഞാന്‍ എന്റെ പാര്‍ശ്വം (കട്ടിലില്‍) വെച്ചു. നിന്റെ നാമത്തില്‍ തന്നെ ഞാനതുയര്‍ത്തുകയും ചെയ്യും. നീ എന്റെ ആത്മാവിനെ പിടിക്കുകയാണെങ്കില്‍ (മരിപ്പിക്കുകയാണെങ്കില്‍) അതിനോട് നീ കരുണ കാണിക്കേണമേ. ഇനി നീ അതിനെ അയക്കുകയാണെങ്കില്‍ (ജീവിപ്പിക്കുകയാണെങ്കില്‍) നിന്റെ സജ്ജനങ്ങളായ അടിമകളെ നീ ഏതൊന്നിനാല്‍ സംരക്ഷിക്കുന്നുവോ അതിനാല്‍ എന്റെ ആത്മാവിനെയും നീ സംരക്ഷിക്കേണമേ."
        },
        {
          arabic: "(3 times)\n اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ",
          malayalam: "(3 തവണ)\n\n      അല്ലാഹുവേ, നിന്റെ അടിമകളെ നീ പുനരുജ്ജീവിപ്പിക്കുന്ന (ഒരുമിച്ചുകൂട്ടുന്ന) ദിവസം നിന്റെ ശിക്ഷയില്‍നിന്നും എന്നെ നീ കാത്തുരക്ഷിക്കേണമേ."

        {
          arabic: "(1 time)\n اللَّهُمَّ رَبَّ السَّمَاوَاتِ وَرَبَّ الْأَرْضِ وَرَبَّ الْعَرْشِ الْعَظِيمِ، رَبَّنَا وَرَبَّ كُلِّ شَيْءٍ، فَالِقَ الْحَبِّ وَالنَّوَى، وَمُنْزِلَ التَّوْرَاةِ وَالْإِنْجِيلِ وَالْفُرْقَانِ، أَعُوذُ بِكَ مِنْ شَرِّ كُلِّ شَيْءٍ، أَنْتَ آخِذٌ بِنَاصِيَتِهِ، اللَّهُمَّ أَنْتَ الْأَوَّلُ فَلَيْسَ قَبْلَكَ شَيْءٌ، وَأَنْتَ الْآخِرُ فَلَيْسَ بَعْدَكَ شَيْءٌ، وَأَنْتَ الظَّاهِرُ فَلَيْسَ فَوْقَكَ شَيْءٌ، وَأَنْتَ الْبَاطِنُ فَلَيْسَ دُونَكَ شَيْءٌ، اقْضِ عَنَّا الدَّيْنَ وَأَغْنِنَا مِنَ الْفَقْرِ",
          malayalam: "(1 തവണ)\n\n      ആകാശങ്ങളുടെയും ഭൂമിയുടെയും റബ്ബും, മഹത്തായ അര്‍ശിന്റെ റബ്ബും, ഞങ്ങളുടെ റബ്ബും എല്ലാറ്റിന്റെയും റബ്ബുമായ അല്ലാഹുവേ, ധാന്യവും കുരുവും പിളര്‍ക്കുന്നവനേ, തൗറാത്ത്, ഇഞ്ചീല്‍, ഖുര്‍ആന്‍ എന്നിവ അവതരിപ്പിച്ചവനേ, നീ നെറുകയില്‍ പിടിക്കുന്ന (നിന്റെ നിയന്ത്രണത്തിലുള്ള) സര്‍വ്വ വസ്തുക്കളുടെയും തിന്മകളില്‍നിന്നും നിന്നോട് ഞാന്‍ രക്ഷതേടുന്നു. അല്ലാഹുവേ, നീയാണ് ഒന്നാമന്‍, നിനക്കുമുമ്പ് യാതൊന്നുമില്ല; നീയാണ് അവസാനത്തെവന്‍, നിനക്കുശേഷം യാതൊന്നുമില്ല; നീയാണ് പ്രകടമായവൻ, നിനക്ക് മീതെ യാതൊന്നുമില്ല; നീയാണ് ഗോപ്യനായവൻ, നിനക്ക് താഴെ യാതൊന്നുമില്ല; ഞങ്ങളുടെ കടം നീ വീട്ടിത്തരികയും ദാരിദ്ര്യം നീക്കി ഞങ്ങളെ നീ ഐശ്വര്യവാന്മാരാക്കുകയും ചെയ്യേണമേ."
        },
        {
          arabic: "(1 time)\n الْحَمْدُ لِلهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَكَفَانَا وَآوَانَا وَكَمْ مِمَّنْ لَا كَافِيَ لَهُ وَلَا مُؤْوِيَ",
          malayalam: "(1 തവണ)\n\n      ഞങ്ങള്‍ക്ക് ഭക്ഷണം നല്‍കുകയും, ഞങ്ങളെ കുടിപ്പിക്കുകയും, ഞങ്ങളുടെ കാര്യങ്ങള്‍ക്കു മതിയായവനാകുകയും, ഞങ്ങള്‍ക്ക് അഭയം നല്‍കുകയും ചെയ്ത അല്ലാഹുവിനാണ് സര്‍വ്വ സ്തുതിയും. കാര്യങ്ങള്‍ക്ക് മതിയായവനില്ലാത്തവരായി, അഭയമില്ലാത്തവരായി എത്രപ്പേരാണുള്ളത്!"
        },
        {
          arabic: "(1 time)\n اللَّهُمَّ فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ ",
          malayalam: "(1 തവണ)\n\n      ആകാശങ്ങളുടെയും ഭൂമിയുടെയും സ്രഷ്ടാവേ, ദൃശ്യവും അദൃശ്യവും അറിയുന്നവനേ, എല്ലാ വസ്തുക്കളുടെയും റബ്ബും ഉടമസ്ഥനുമേ, നീയല്ലാതെ മറ്റൊരു ആരാധ്യനുമില്ലെന്ന് ഞാന്‍ സാക്ഷ്യം വഹിക്കുന്നു. എന്റെ മനസ്സിന്റെ തിന്മയില്‍നിന്നും പിശാചിന്റെയും അവന്‍ (അല്ലാഹുവിന്) പങ്കുകാരെ ചേര്‍ക്കാന്‍ പ്രേരിപ്പിക്കുന്നതിന്റെയും തിന്മയില്‍നിന്നും നിന്നോട് ഞാന്‍ രക്ഷ തേടുന്നു."
        },
        {
          arabic: "(1 time)\n Surah sajada",
          malayalam: "(1 തവണ)\n സൂറത്തു സജ്ദ പാരായണം ചെയ്യുക"
        },
        {
          arabic: "(1 time)\n Surah mulk",
          malayalam: "(1 തവണ)\n സൂറത്തു മുൽക്ക് പാരായണം ചെയ്യുക"
        },
        {
          arabic: "(1 time)\n اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ رَغْبَةً وَرَهْبَةً إِلَيْكَ لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ ",
          malayalam: "(1 തവണ)\n\n      അല്ലാഹുവേ, നിന്നിലേക്കുള്ള ആഗ്രഹത്തോടും നിന്നോടുള്ള ഭയത്തോടും കൂടി എന്റെ മനസ്സിനെ നിനക്ക് ഞാന്‍ കീഴ്പ്പെടുത്തിത്തന്നിരിക്കുന്നു. എന്റെ കാര്യങ്ങളെല്ലാം നിന്നിലേല്‍പ്പിച്ചിരിക്കുന്നു. എന്റെ മുഖം നിന്നിലേക്ക് ഞാന്‍ തിരിക്കുകയും, എന്റെ പുറം നിന്നിലേക്ക് ചാരിവെക്കുകയും ചെയ്തിരിക്കുന്നു. നിന്നില്‍നിന്ന് നിന്നിലേക്കല്ലാതെ ഒരഭയസ്ഥാനവും രക്ഷാകേന്ദ്രവുമില്ല. നീ അവതരിപ്പിച്ച നിന്റെ ഗ്രന്ഥത്തിലും, നീ നിയോഗിച്ച നിന്റെ പ്രവാചകനിലും ഞാനിതാ വിശ്വസിച്ചിരിക്കുന്നു."
        },
        {
          arabic: "(1 time)\n Surah kafiroon",
          malayalam: "(1 തവണ)\n സൂറത്തുൽ കാഫിറൂൻ പാരായണം ചെയ്യുക"
        }
      ]
    };

    const now = new Date().getHours();
    const slot = now >= 5 && now < 9 ? 'morning'
      : now >= 9 && now < 16 ? 'general'
        : now >= 16 && now < 19 ? 'evening'
          : 'night';

    let selectedAdhkar = adhkars[slot];
    let index = 0;
    let isAutoScrolling = false;
    let autoScrollInterval;
    let completedIndices = new Set();

    // localStorage keys
    const STORAGE_KEY_PREFIX = 'adhkar_progress_';
    const STORAGE_KEY_INDEX = 'adhkar_index_';
    const STORAGE_KEY_DATE = 'adhkar_date_';

    const adhkarText = document.getElementById('adhkarText');
    const adhkarMalayalam = document.getElementById('adhkarMalayalam');
    const adhkarIndex = document.getElementById('adhkarIndex');
    const autoScrollBtn = document.getElementById('autoScrollBtn');
    const autoIcon = document.getElementById('autoIcon');
    const autoText = document.getElementById('autoText');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const completedCount = document.getElementById('completedCount');
    const remainingCount = document.getElementById('remainingCount');
    const totalCount = document.getElementById('totalCount');
    const timeBadge = document.getElementById('timeBadge');
    const scrollTopBtn = document.getElementById('scrollTopBtn');

    // --- Settings Logic ---
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettings = document.getElementById('closeSettings');
    const fontSelect = document.getElementById('fontSelect');
    const sizeRange = document.getElementById('sizeRange');
    const fontPreview = document.getElementById('fontPreview');
    const resetSettings = document.getElementById('resetSettings');

    function loadSettings() {
      const savedFont = localStorage.getItem('adhkar_pref_font') || "'Noto Naskh Arabic', serif";
      const savedSize = localStorage.getItem('adhkar_pref_size') || "1.8";

      document.documentElement.style.setProperty('--adhkar-font', savedFont);
      document.documentElement.style.setProperty('--adhkar-size', savedSize + 'rem');

      if (fontSelect) fontSelect.value = savedFont;
      if (sizeRange) sizeRange.value = savedSize;
      if (fontPreview) fontPreview.style.fontFamily = savedFont;
    }

    if (settingsBtn) {
      settingsBtn.addEventListener('click', () => {
        settingsModal.style.display = 'flex';
      });
    }

    if (closeSettings) {
      closeSettings.addEventListener('click', () => {
        settingsModal.style.display = 'none';
      });
    }

    window.addEventListener('click', (e) => {
      if (e.target === settingsModal) {
        settingsModal.style.display = 'none';
      }
    });

    if (fontSelect) {
      fontSelect.addEventListener('change', (e) => {
        const font = e.target.value;
        document.documentElement.style.setProperty('--adhkar-font', font);
        fontPreview.style.fontFamily = font;
        localStorage.setItem('adhkar_pref_font', font);
      });
    }

    if (sizeRange) {
      sizeRange.addEventListener('input', (e) => {
        const size = e.target.value;
        document.documentElement.style.setProperty('--adhkar-size', size + 'rem');
        // Also update font preview live
        if (fontPreview) fontPreview.style.fontSize = size + 'rem';
        localStorage.setItem('adhkar_pref_size', size);
      });
    }

    if (resetSettings) {
      resetSettings.addEventListener('click', () => {
        localStorage.removeItem('adhkar_pref_font');
        localStorage.removeItem('adhkar_pref_size');
        loadSettings();
      });
    }

    // Initialize settings
    loadSettings();
    // --- End Settings Logic ---

    const slotNames = {
      morning: 'Morning',
      general: 'General',
      evening: 'Evening',
      night: 'Night'
    };

    document.getElementById('pageTitle').textContent = `${slotNames[slot]} Adhkar`;
    timeBadge.textContent = `${slotNames[slot]} Adhkar`;

    // Helper to get logical date string
    // For night slot (19:00 - 05:00), hours 00:00-04:59 count as part of "yesterday"
    function getLogicalDateStr() {
      const d = new Date();
      if (slot === 'night' && now < 5) {
        d.setDate(d.getDate() - 1);
      }
      return d.toDateString();
    }

    // Save progress to localStorage
    function saveProgress() {
      try {
        const progressKey = STORAGE_KEY_PREFIX + slot;
        const indexKey = STORAGE_KEY_INDEX + slot;
        const dateKey = STORAGE_KEY_DATE + slot;

        // Save completed indices as array
        localStorage.setItem(progressKey, JSON.stringify(Array.from(completedIndices)));
        // Save current index
        localStorage.setItem(indexKey, index.toString());
        // Save date
        localStorage.setItem(dateKey, getLogicalDateStr());
      } catch (e) {
        console.error('Error saving progress:', e);
      }
    }

    // Load progress from localStorage
    function loadProgress() {
      try {
        const progressKey = STORAGE_KEY_PREFIX + slot;
        const indexKey = STORAGE_KEY_INDEX + slot;
        const dateKey = STORAGE_KEY_DATE + slot;

        // Check date first
        const savedDate = localStorage.getItem(dateKey);
        const currentDate = getLogicalDateStr();

        if (savedDate !== currentDate) {
          // If stored date doesn't match current logical date, start fresh
          clearProgress();
          return;
        }

        // Load completed indices
        const savedProgress = localStorage.getItem(progressKey);
        if (savedProgress) {
          const indicesArray = JSON.parse(savedProgress);
          completedIndices = new Set(indicesArray.map(Number));
        }

        // Load saved index
        const savedIndex = localStorage.getItem(indexKey);
        if (savedIndex !== null) {
          const savedIndexNum = parseInt(savedIndex, 10);
          if (savedIndexNum >= 0 && savedIndexNum < selectedAdhkar.length) {
            index = savedIndexNum;
          }
        }
      } catch (e) {
        console.error('Error loading progress:', e);
      }
    }

    // Clear progress for current slot (optional utility function)
    function clearProgress() {
      try {
        const progressKey = STORAGE_KEY_PREFIX + slot;
        const indexKey = STORAGE_KEY_INDEX + slot;
        const dateKey = STORAGE_KEY_DATE + slot;

        localStorage.removeItem(progressKey);
        localStorage.removeItem(indexKey);
        localStorage.removeItem(dateKey);
        completedIndices.clear();
        index = 0;
        updateProgress();
        showAdhkar();
      } catch (e) {
        console.error('Error clearing progress:', e);
      }
    }

    function updateProgress() {
      const total = selectedAdhkar.length;
      const completed = completedIndices.size;
      const remaining = total - completed;
      const percentage = total > 0 ? (completed / total) * 100 : 0;

      progressFill.style.width = percentage + '%';
      progressText.textContent = `${completed} / ${total}`;
      completedCount.textContent = completed;
      remainingCount.textContent = remaining;
      totalCount.textContent = total;
    }

    function showAdhkar() {
      const currentAdhkar = selectedAdhkar[index];
      if (typeof currentAdhkar === 'string') {
        adhkarText.textContent = currentAdhkar;
        adhkarMalayalam.textContent = '';
      } else {
        adhkarText.textContent = currentAdhkar.arabic || currentAdhkar;
        adhkarMalayalam.textContent = currentAdhkar.malayalam || '';
      }
      adhkarIndex.textContent = `Adhkar ${index + 1} of ${selectedAdhkar.length}`;

      // Mark as viewed
      completedIndices.add(index);
      updateProgress();
      saveProgress(); // Save progress after viewing
    }

    function nextAdhkar() {
      if (index < selectedAdhkar.length - 1) {
        index++;
        showAdhkar();
        scrollToTop();
      }
    }

    function prevAdhkar() {
      if (index > 0) {
        index--;
        showAdhkar();
        scrollToTop();
      }
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleAutoScroll() {
      if (isAutoScrolling) {
        clearInterval(autoScrollInterval);
        isAutoScrolling = false;
        autoIcon.className = 'fas fa-play';
        autoText.textContent = 'Auto';
        autoScrollBtn.classList.remove('active');
      } else {
        isAutoScrolling = true;
        autoIcon.className = 'fas fa-pause';
        autoText.textContent = 'Pause';
        autoScrollBtn.classList.add('active');
        autoScrollInterval = setInterval(() => {
          if (index < selectedAdhkar.length - 1) {
            nextAdhkar();
          } else {
            toggleAutoScroll();
          }
        }, 8000);
      }
    }

    document.getElementById('nextBtn').onclick = nextAdhkar;
    document.getElementById('prevBtn').onclick = prevAdhkar;
    autoScrollBtn.onclick = toggleAutoScroll;

    scrollTopBtn.onclick = scrollToTop;

    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        scrollTopBtn.style.display = 'flex';
      } else {
        scrollTopBtn.style.display = 'none';
      }
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextAdhkar();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevAdhkar();
      }
    });

    // Save progress before page unload
    window.addEventListener('beforeunload', () => {
      saveProgress();
    });

    // Initialize - Load saved progress first
    loadProgress();
    showAdhkar();
    updateProgress();

    // Swipe Gestures — strict directional check to avoid scroll triggering slide change
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;
    const minSwipeDistance = 90; // higher = less sensitive

    document.querySelector('.adhkar-card').addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.querySelector('.adhkar-card').addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);
      // Require horizontal to be at least 2x vertical (strict angle), and exceed minimum distance
      if (absDx < minSwipeDistance) return;
      if (absDx < absDy * 2) return; // too diagonal — treat as scroll
      if (dx < 0) {
        nextAdhkar(); // Swipe Left → Next
      } else {
        prevAdhkar(); // Swipe Right → Previous
      }
    }
  </script>
</body>
