  <style>
    /* ── Main-page matching button style ── */
    :root {
      --accent-cyan: #4fd1c5;
      --accent-teal: #0d564f;
      --glow-teal: rgba(13, 86, 79, 0.4);
    }
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      padding: 20px 16px 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    .qa-btn {
      width: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: rgba(13, 86, 79, 0.1);
      border: 1px solid rgba(26, 122, 112, 0.3);
      border-radius: 20px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    .qa-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .qa-btn:hover {
      background: rgba(13, 86, 79, 0.3);
      border-color: var(--accent-cyan);
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 15px 30px rgba(79, 209, 197, 0.4);
    }

    .qa-btn:hover::before { opacity: 1; }

    .qa-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-teal), #1a7a70);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      z-index: 2;
    }

    .qa-icon::after {
      content: '';
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, var(--accent-cyan) 25%, transparent 50%);
      animation: spin 2s linear infinite;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .qa-btn:hover .qa-icon {
      transform: scale(1.15) rotate(5deg);
    }

    .qa-btn:hover .qa-icon::after {
      opacity: 1;
    }

    @media (max-width: 480px) {
      .quick-actions { grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .qa-btn {
        width: auto;
        padding: 15px 10px;
        font-size: 0.8rem;
      }
      .qa-icon { width: 46px; height: 46px; font-size: 1.3rem; }
    }
  </style>
<script src="/theme.js"></script>

<body class=" black">
