<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Ilmify - Madeena book</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@300;400;600;700&family=Amiri&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --radius: 20px;
      --bg-dark: #040914;
      --card-bg: rgba(15, 23, 42, 0.85);
      --accent: linear-gradient(135deg, #10b981 0%, #34d399 100%);
      --accent-solid: #10b981;
      --border: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --muted: #cbd5e1;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Anek Latin', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #051614 0%, #072a24 100%);
      background-attachment: fixed;
      color: var(--text-main);
      font-size: 16px;
      line-height: 1.6;
    }

    .app-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 100px 15px 40px 15px;
    }

    .app {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .cover {
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .main-title {
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: 0.5px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .volume-badge {
      background: var(--accent);
      color: #0a0f16;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 10px rgba(79, 172, 254, 0.3);
    }

    .sub {
      color: var(--accent-solid);
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .controls {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .audio-player {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 16px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .play-btn {
      width: 56px;
      height: 56px;
      border: none;
      background: var(--accent);
      color: #0a0f16;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 22px;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s;
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(79, 172, 254, 0.6);
    }

    .progress-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-filled {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 4px;
      box-shadow: 0 0 10px var(--accent-solid);
      transition: width 0.1s linear;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    .volume-control,
    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
    }

    .speed-control select {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }

    .speed-control select:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .speed-control select option {
      background: #0a0f16;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      padding: 12px 28px;
      border: 1px solid var(--border);
      border-radius: 30px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .pill {
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .notes-panel {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px;
      border-radius: 16px;
      display: none;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 12px;
    }

    .notes-title {
      font-weight: 700;
      color: var(--accent-solid);
      letter-spacing: 1px;
      font-size: 1.1rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 12px;
      border-radius: 20px;
    }

    .note-item {
      background: rgba(255, 255, 255, 0.06);
      border-right: 5px solid var(--accent-solid);
      border-radius: 12px;
      padding: 24px;
      font-size: 1.5rem;
      font-weight: 500;
      line-height: 2.2;
      text-align: right;
      font-family: 'Amiri', serif;
      color: #ffffff;
      transition: background 0.3s;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    .note-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .pdf-embed {
      width: 100%;
      height: 75vh;
      min-height: 500px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      background: #fff;
    }

    .selector-btn {
      padding: 10px 22px;
      border: 1px solid var(--border);
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      transition: all 0.3s ease;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .selector-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .selector-btn.active {
      background: var(--accent);
      color: #0a0f16;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
    }

    .volume-selector {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 8px;
      gap: 4px;
    }

    .volume-selector::-webkit-scrollbar {
      height: 4px;
    }

    .volume-selector::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    select.part-select {
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    @media (max-width: 768px) {
      .app-wrapper {
        padding: 85px 12px 20px 12px;
      }

      .cover, .controls {
        padding: 20px 16px;
      }

      .main-title {
        font-size: 1.35rem;
        gap: 8px;
      }

      .audio-player {
        flex-direction: column;
        padding: 20px 16px;
        gap: 16px;
      }

      .progress-container {
        width: 100%;
        margin: 0;
      }

      .play-btn {
        width: 60px;
        height: 60px;
        font-size: 24px;
      }

      .volume-control, .speed-control {
        width: 100%;
        justify-content: space-between;
      }

      .nav-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .nav-bar > div {
        display: flex;
        width: 100%;
        gap: 8px !important;
      }

      .nav-bar .btn, .pill {
        flex: 1;
        justify-content: center;
        text-align: center;
      }

      .note-item {
        padding: 16px;
        font-size: 1.3rem;
        line-height: 1.8;
      }

      .notes-panel {
        padding: 16px;
      }

      .pdf-embed {
        height: 60vh;
        min-height: 350px;
      }

      header {
        font-size: 1.05rem !important;
        padding: 15px !important;
      }
      
      header a {
        font-size: 1.2rem !important;
        top: 15px !important;
        left: 15px !important;
      }
    }
  </style>
</head>

              "
            ],
            durationText: "14:32"
          },
          {

            title: "Lesson 9.3",
            audio: "https://res.cloudinary.com/dobw6i86s/video/upload/v1756461107/wjfqkbrzoujjbqqqdhko.mp3",
            notes: [
              "📝دروس اللغة العربية لغير الناطقين بها (الجزء الأول) 📝\n\
📢الدرس التاسع -٩\n",
              "Lesson -9,part 4",
              "⬅️جُمْلَةٌ اسْمِيَّةٌ\n\
⬅️جُمْلَةٌ فِعْلِيَّةٌ\n\

              "✏️مُبْتَدَأٌ+خَبَرٌ =جُمْلَةٌ اسْمِيَّةٌ\n\

",
              "\
✏️فِعلٌ+فاعِلٌ =جُمْلَةٌ فِعْلِيَّةٌ\n\
➖مِثَالٌ :ذهَبَ مُحَمَّدٌ\n\
", "\
✏️شِبْهُ الجُمْلَةِ \n\
➖مِثَالٌ :علَى المَكتَبِ\n\
             :في الغُرفَةِ",
            ],
            durationText: "15:21"
          },
          {
            part: 27,
            title: "Lesson 9.4",
            audio: "https://res.cloudinary.com/dobw6i86s/video/upload/v1756461544/bldespeakbecfhcgjffs.mp3",
            notes: [
              "📝دروس اللغة العربية لغير الناطقين بها (الجزء الأول) 📝\n\
📢الدرس التاسع -٩\n",
              "Lesson -9,part 5",
              "⬅️الَّذِي- الاسْمُ المَوصُولُ"
            ],
            durationText: "17:36"
          },

        ]
      },
      {
        volume: 2,
        pdf: "",
        parts: [
          {
            part: 1,
            title: "Part 1",
            audio: "audio4.mp3",
            notes: [
              "We upload soon"
            ],
            durationText: "--:--"
          }
        ]
      },
      {
        volume: 3,
        pdf: "",
        parts: [
          {
            part: 1,
            title: "Part 1",
            audio: "audio4.mp3",
            notes: [
              "We upload soon"
            ],
            durationText: "--:--"
          },
          {
            part: 2,
            title: "Part 2",
            audio: "audio5.mp3",
            notes: ["We upload soon"],
            durationText: "--:--"
          }
        ]
      }
    ];

    let savedProgress = JSON.parse(localStorage.getItem('madeena_locProgress') || '{}');
    let currentVolumeIdx = savedProgress.v || 0;
    let currentPartIdx = savedProgress.p || 0;
    let savedTime = savedProgress.t || 0;

    const volumeLabel = document.getElementById("volume-label");
    const partLabel = document.getElementById("part-label");
    const pillVolume = document.getElementById("pill-volume");
    const pillPart = document.getElementById("pill-part");
    const notesPanel = document.getElementById("notes-panel");
    const toggleNotesBtn = document.getElementById("toggleNotesBtn");
    const notesContainer = document.getElementById("notes-container");
    const lessonDuration = document.getElementById("lesson-duration");
    const volumeSelector = document.getElementById("volume-selector");
    const partSelect = document.getElementById("partSelect");
    const audioEl = document.getElementById("audio");
    const playPause = document.getElementById("playPause");
    const progressBar = document.getElementById("progressBar");
    const progressFilled = document.getElementById("progressFilled");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const volumeSlider = document.getElementById("volume");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const speedSelect = document.getElementById("speedSelect");
    const pdfFrame = document.getElementById("pdfFrame");

    function clearAudioError() {
      const existing = document.getElementById('audio-error');
      if (existing) existing.remove();
    }

    function loadUI() {
      const loader = document.getElementById("initial-loader");
      if(loader) loader.style.display = "none";

      renderVolumeButtons();
      populatePartSelect();
      loadCurrentLesson();
    }

    function renderVolumeButtons() {
      volumeSelector.innerHTML = "";
      LESSONS.forEach((v, vi) => {
        const btn = document.createElement("button");
        btn.textContent = `Volume ${v.volume}`;
        btn.className = "selector-btn" + (vi === currentVolumeIdx ? " active" : "");
        btn.addEventListener("click", () => {
          currentVolumeIdx = vi;
          currentPartIdx = 0;
          renderVolumeButtons();
          populatePartSelect();
          loadCurrentLesson();
        });
        volumeSelector.appendChild(btn);
      });
    }

    function populatePartSelect() {
      partSelect.innerHTML = "";
      const parts = LESSONS[currentVolumeIdx].parts;
      parts.forEach((p, pi) => {
        const opt = document.createElement("option");
        opt.value = pi;
        opt.textContent = p.title;
        if (pi === currentPartIdx) opt.selected = true;
        partSelect.appendChild(opt);
      });
      partSelect.onchange = () => {
        currentPartIdx = parseInt(partSelect.value, 10);
        loadCurrentLesson();
      };
    }

    function loadCurrentLesson() {
      if (currentVolumeIdx >= LESSONS.length) currentVolumeIdx = 0;
      if (currentPartIdx >= LESSONS[currentVolumeIdx].parts.length) currentPartIdx = 0;

      const volumeObj = LESSONS[currentVolumeIdx];
      const partObj = volumeObj.parts[currentPartIdx];

      volumeLabel.textContent = `VOLUME ${volumeObj.volume}`;
      partLabel.textContent = partObj.title;
      pillVolume.textContent = `Volume ${volumeObj.volume}`;
      pillPart.textContent = `${partObj.title}`;
      lessonDuration.textContent = `مدة الدرس: ${partObj.durationText} دقيقة`;

      // PDF per volume: clear any old no-pdf note
      const existingNoPdf = document.getElementById('no-pdf-note');
      if (existingNoPdf) existingNoPdf.remove();
      if (volumeObj.pdf) {
        pdfFrame.src = volumeObj.pdf;
        pdfFrame.style.display = "block";
      } else {
        pdfFrame.style.display = "none";
      }

      // Notes: clear previous notes but keep no-pdf fallback added below
      notesContainer.innerHTML = "";
      if (!volumeObj.pdf) {
        const note = document.createElement('div');
        note.id = 'no-pdf-note';
        note.className = 'note-item';
        note.textContent = 'لا يوجد ملف ملاحظات متاح لهذا الـ Volume بعد.';
        notesContainer.appendChild(note);
      }
      partObj.notes.forEach(n => {
        const div = document.createElement("div");
        div.className = "note-item";
        div.innerHTML = n.replace(/\n/g, "<br>");
        notesContainer.appendChild(div);
      });

      // Audio: clear previous error and set new source
      clearAudioError();
      playPause.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
      audioEl.src = partObj.audio;
      audioEl.load();

      // Ensure that if we switch lessons manually, we don't jump to old savedTime 
      if (savedProgress.v !== currentVolumeIdx || savedProgress.p !== currentPartIdx) {
        savedTime = 0;
      }
      localStorage.setItem('madeena_locProgress', JSON.stringify({ v: currentVolumeIdx, p: currentPartIdx, t: savedTime }));

      // Prev/next state
      prevBtn.disabled = !hasPrev();
      nextBtn.disabled = !hasNext();
      partSelect.value = currentPartIdx;
    }

    function hasPrev() {
      if (currentPartIdx > 0) return true;
      return currentVolumeIdx > 0 && LESSONS[currentVolumeIdx - 1].parts.length > 0;
    }
    function hasNext() {
      if (currentPartIdx + 1 < LESSONS[currentVolumeIdx].parts.length) return true;
      return currentVolumeIdx + 1 < LESSONS.length && LESSONS[currentVolumeIdx + 1].parts.length > 0;
    }
    function goPrev() {
      if (!hasPrev()) return;
      if (currentPartIdx > 0) {
        currentPartIdx--;
      } else {
        currentVolumeIdx--;
        currentPartIdx = LESSONS[currentVolumeIdx].parts.length - 1;
        renderVolumeButtons();
        populatePartSelect();
      }
      loadCurrentLesson();
    }
    function goNext() {
      if (!hasNext()) return;
      if (currentPartIdx + 1 < LESSONS[currentVolumeIdx].parts.length) {
        currentPartIdx++;
      } else {
        currentVolumeIdx++;
        currentPartIdx = 0;
        renderVolumeButtons();
        populatePartSelect();
      }
      loadCurrentLesson();
    }

    // Audio logic
    audioEl.volume = 0.7;
    volumeSlider.value = audioEl.volume;

    playPause.addEventListener("click", () => {
      if (playPause.innerHTML.includes('fa-spinner')) return; // ignore clicks while loading
      if (audioEl.paused) audioEl.play();
      else audioEl.pause();
    });

    audioEl.addEventListener("play", () => {
      playPause.innerHTML = "❚❚";
      playPause.setAttribute("aria-label", "Pause");
    });
    audioEl.addEventListener("pause", () => {
      playPause.innerHTML = "▶";
      playPause.setAttribute("aria-label", "Play");
    });
    audioEl.addEventListener('loadstart', () => {
      playPause.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    });
    audioEl.addEventListener('waiting', () => {
      playPause.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    });
    audioEl.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(audioEl.duration);
      if (savedTime > 0) {
          audioEl.currentTime = savedTime;
      }
    });
    audioEl.addEventListener("timeupdate", () => {
      currentTimeEl.textContent = formatTime(audioEl.currentTime);
      const percent = (audioEl.currentTime / audioEl.duration) * 100;
      progressFilled.style.width = percent + "%";
      
      localStorage.setItem('madeena_locProgress', JSON.stringify({ 
          v: currentVolumeIdx, 
          p: currentPartIdx, 
          t: audioEl.currentTime 
      }));
    });
    audioEl.addEventListener('canplay', () => {
      clearAudioError();
      playPause.innerHTML = audioEl.paused ? "▶" : "❚❚";
    });
    audioEl.addEventListener('error', () => {
      if (!document.getElementById('audio-error')) {
        const err = document.createElement('div');
        err.id = 'audio-error';
        err.style.background = '#ffdce0';
        err.style.padding = '8px';
        err.style.borderRadius = '6px';
        err.style.marginTop = '6px';
        err.textContent = 'This part is not available for now';
        document.querySelector('.audio-player').appendChild(err);
      }
    });

    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    progressBar.addEventListener("click", (e) => {
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.min(Math.max(clickX / rect.width, 0), 1);
      audioEl.currentTime = ratio * audioEl.duration;
    });
    progressBar.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") audioEl.currentTime = Math.min(audioEl.currentTime + 5, audioEl.duration);
      if (e.key === "ArrowLeft") audioEl.currentTime = Math.max(audioEl.currentTime - 5, 0);
    });
    volumeSlider.addEventListener("input", (e) => {
      audioEl.volume = e.target.value;
    });

    if (speedSelect) {
      speedSelect.addEventListener('change', () => {
        audioEl.playbackRate = parseFloat(speedSelect.value);
      });
    }

    prevBtn.addEventListener("click", goPrev);
    nextBtn.addEventListener("click", goNext);

    toggleNotesBtn.addEventListener("click", () => {
      const expanded = toggleNotesBtn.getAttribute("aria-expanded") === "true";
      if (expanded) {
        notesPanel.style.display = "none";
        toggleNotesBtn.setAttribute("aria-expanded", "false");
      } else {
        notesPanel.style.display = "flex";
        toggleNotesBtn.setAttribute("aria-expanded", "true");
        notesPanel.scrollIntoView({ behavior: "smooth" });
      }
    });

    // Init and merge Firebase data seamlessly
    const db = window.firebaseDb || (typeof firebase !== 'undefined' ? firebase.database() : null);
    if (db) {
      db.ref("madeena_lessons").once("value", snapshot => {
        if (snapshot.exists()) {
          snapshot.forEach(child => {
            const data = child.val();
            if (!data || !data.volume || !data.partObj) return;

            const volIdx = LESSONS.findIndex(v => v.volume == data.volume);
            if (volIdx > -1) {
              const existingPart = LESSONS[volIdx].parts.find(p => p.part == data.partObj.part);
              if (!existingPart) LESSONS[volIdx].parts.push(data.partObj);
            } else {
              LESSONS.push({
                volume: data.volume,
                pdf: "",
                parts: [data.partObj]
              });
            }
          });

          LESSONS.sort((a, b) => a.volume - b.volume);
          LESSONS.forEach(v => {
            if (v.parts) v.parts.sort((a, b) => a.part - b.part);
          });
        }
        loadUI();
      }).catch(err => {
        console.error("Firebase error loading extra lessons:", err);
        loadUI();
      });
    } else {
      loadUI();
    }
  </script>
