  <script>
    // Firebase is initialized in firebase-config.js
    const auth = window.firebaseAuth || firebase.auth();

    // Check if user is logged in
    auth.onAuthStateChanged(user => {
      if (!user) {
        // No user signed in, redirect to login
        window.location.href = "../login.html";
      } else if (user.email != "piousbrotherscommunity@gmail.com") {
        window.location.href = "../login.html"
      } else {
        loadVisitorStats();
      }
    });

    // Load site-wide visitor stats
    function loadVisitorStats() {
      const db = window.firebaseDb || firebase.database();
      const date = new Date();
      const today = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

      // Today's Visitors
      db.ref('analytics/site/dailyVisitors/' + today).on('value', snapshot => {
        document.getElementById('todayVisitors').innerText = (snapshot.val() || 0).toLocaleString();
      });

      // Average Daily Visitors
      db.ref('analytics/site/dailyVisitors').on('value', snapshot => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          const days = Object.keys(data).length;
          const total = Object.values(data).reduce((a, b) => a + b, 0);
          const avg = days > 0 ? Math.round(total / days) : 0;
          document.getElementById('avgVisitors').innerText = avg.toLocaleString();
        }
      });

      // Madeena Total Views
      db.ref('analytics/madeena/totalViews').on('value', snapshot => {
        document.getElementById('madeenaTotalViews').innerText = (snapshot.val() || 0).toLocaleString();
      });

      // Madeena Today's Views
      db.ref('analytics/madeena/dailyViews/' + today).on('value', snapshot => {
        document.getElementById('madeenaTodayViews').innerText = (snapshot.val() || 0).toLocaleString();
      });

      // Madeena Average Daily Views
      db.ref('analytics/madeena/dailyViews').on('value', snapshot => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          const days = Object.keys(data).length;
          const total = Object.values(data).reduce((a, b) => a + b, 0);
          const avg = days > 0 ? Math.round(total / days) : 0;
          document.getElementById('madeenaAvgViews').innerText = avg.toLocaleString();
        }
      });
    }

    // Logout function
    function logout() {
      auth.signOut().then(() => {
        window.location.href = "../login.html";
      });
    }
  </script>
