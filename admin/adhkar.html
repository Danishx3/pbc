<!DOCTYPE html>
<html lang="en">

<head>
  <title>Adhkar Tracking - ILMIFY Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Styles -->
  <link rel="stylesheet" href="../pbc.css">
  <link rel="icon" href="../logoo.png" type="image/icon type">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: rgba(13, 86, 79, 0.15);
      border: 1px solid rgba(13, 86, 79, 0.3);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .stat-card:hover {  
      background: rgba(13, 86, 79, 0.25);
      border-color: rgba(13, 86, 79, 0.5);
    }
    .stat-icon {
      font-size: 3.5rem;
      color: #1a7a70;
      margin-bottom: 15px;
    }
    .stat-value {
      font-size: 3rem;
      font-weight: bold;
      color: #afe9da;
      margin-bottom: 5px;
    }
    .stat-label {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .custom-scrollbar::-webkit-scrollbar {
        height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--primary-color);
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: var(--primary-hover);
    }
    .category-container {
        background: rgba(13, 86, 79, 0.1);
        padding: 20px;
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="../firebase-config.js"></script>
</head>

<body class="black">
  <div class="">
    <nav class="nav navbar navbar-expand-lg text-white ">
      <div class="container-fluid">
        <img src="../logoo.png" style="margin-right: 10px; border-radius: 70px; width: 40px; height: 40px;" class=""
          alt="">
        <center><a style="font-weight: bold;" href="#" class="navbar-brand text-white"> &#8193;ILMIFY ADMIN</a>
        </center>
        <button style="border: transparent;" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
          aria-label="Toggle navigation">
          <span><i class="fa fa-bars text-white"></i></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link text-white" aria-current="page" href="admin.html">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active text-white" aria-current="page" href="adhkar.html">Adhkar</a>
            </li>
          </ul>
          <button
            style="border-radius: 20px; border-color: transparent; color: #fff; background-color: rgb(43, 44, 43);"
            onclick="logout()">logout</button>
        </div>
      </div>
    </nav>
  </div>

  <div class="admin-container">
    <div class="intro">
        <center>
            <h2 style="color: #afe9da; margin-bottom: 10px;"><i class="fas fa-moon"></i> Adhkar Management</h2>
            <p style="color: rgba(255, 255, 255, 0.7);">Monitor Adhkar Feature Usage</p>
        </center>
    </div>

    <!-- Statistics -->
    <div class="stats-grid intro">
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-calendar-day"></i></div>
            <div class="stat-value"><span id="todayCount">0</span></div>
            <div class="stat-label">Today's Views</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
            <div class="stat-value"><span id="averageCount">0</span></div>
            <div class="stat-label">Average Views</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-users"></i></div>
            <div class="stat-value"><span id="usageCount">0</span></div>
            <div class="stat-label">Total Visits / Uses</div>
        </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <script>
    // Firebase is initialized in firebase-config.js
    const auth = window.firebaseAuth || firebase.auth();
    const db = window.firebaseDb || firebase.database();

    // Check if user is logged in
    auth.onAuthStateChanged(user => {
      if (!user) {
        // No user signed in, redirect to login
        window.location.href = "../login.html";
      } else if (user.email != "piousbrotherscommunity@gmail.com") {
        window.location.href = "../login.html"
      } else {
        loadAdhkarStats();
      }
    });

    // Load Adhkar Usage Statistics from Firebase Realtime DB
    function loadAdhkarStats() {
      // Total Views
      db.ref('analytics/adhkar/usageCount').on('value', (snapshot) => {
        const usage = snapshot.val() || 0;
        document.getElementById('usageCount').innerText = usage.toLocaleString();
      });

      // Today's Date
      const date = new Date();
      const today = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

      // Daily Analytics
      db.ref('analytics/adhkar/dailyViews').on('value', (snapshot) => {
        const dailyData = snapshot.val() || {};
        
        // Today's Views
        const todayViews = dailyData[today] || 0;
        document.getElementById('todayCount').innerText = todayViews.toLocaleString();

        // Average Views
        const viewValues = Object.values(dailyData);
        if (viewValues.length > 0) {
          const totalViews = viewValues.reduce((sum, val) => sum + val, 0);
          const average = totalViews / viewValues.length;
          document.getElementById('averageCount').innerText = Math.round(average).toLocaleString();
        } else {
          document.getElementById('averageCount').innerText = "0";
        }
      });
    }

    // Logout function
    function logout() {
      auth.signOut().then(() => {
        window.location.href = "../login.html";
      });
    }
  </script>
</body>

</html>
