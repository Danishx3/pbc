<!DOCTYPE html>
<html lang="en">

<head>
  <title>Quest Scholars - ILMIFY Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Styles -->
  <link rel="stylesheet" href="../pbc.css">
  <link rel="icon" href="../logoo.png" type="image/icon type">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="../firebase-config.js"></script>
  
  <style>
    .admin-card {
      background: rgba(13, 86, 79, 0.2);
      border: 1px solid rgba(13, 86, 79, 0.4);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      color: #fff;
    }
    .table-dark-custom {
      background: rgba(0, 0, 0, 0.3);
      color: #afe9da;
      border-radius: 12px;
      overflow: hidden;
    }
    .table-dark-custom th {
      background: rgba(13, 86, 79, 0.5);
      color: #fff;
      border-bottom: 2px solid #1a7a70;
    }
    .table-dark-custom td {
      border-bottom: 1px solid rgba(13, 86, 79, 0.3);
      vertical-align: middle;
    }
    .card-badge {
      display: inline-block;
      background: rgba(155, 89, 182, 0.3);
      border: 1px solid #9b59b6;
      color: #e0bbff;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      margin: 2px;
    }
    .stat-val {
      font-weight: bold;
      color: #f1c40f;
    }
    .guest-marker {
      font-size: 0.7rem;
      background: #e67e22;
      color: #fff;
      padding: 1px 4px;
      border-radius: 4px;
      margin-left: 5px;
    }
  </style>
<script src="/theme.js"></script>
</head>

<body class="black">
  <nav class="nav navbar navbar-expand-lg text-white">
    <div class="container-fluid">
      <img src="../logoo.png" style="margin-right: 10px; border-radius: 70px; width: 40px; height: 40px;">
      <a style="font-weight: bold;" href="admin.html" class="navbar-brand text-white">ILMIFY ADMIN</a>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link text-white" href="admin.html"><i class="fas fa-arrow-left"></i> Back</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 style="color: #fff;"><i class="fa-solid fa-ranking-star text-warning"></i> Arabic Quest Scholars</h2>
      <div class="text-white">
        Total Scholars: <span id="scholarCount" class="stat-val">0</span>
      </div>
    </div>

    <div class="admin-card">
      <div class="table-responsive">
        <table class="table table-dark-custom">
          <thead>
            <tr>
              <th>Scholar</th>
              <th>Coins</th>
              <th>XP</th>
              <th>Cards Collected</th>
              <th>Recent Active</th>
            </tr>
          </thead>
          <tbody id="scholarsList">
            <tr>
              <td colspan="5" class="text-center p-5">
                <i class="fa fa-spinner fa-spin fa-2x"></i><br>Fetching scholar data...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const auth = window.firebaseAuth || firebase.auth();
    const db = window.firebaseDb || firebase.database();

    auth.onAuthStateChanged(user => {
      if (!user || user.email !== "piousbrotherscommunity@gmail.com") {
        window.location.href = "../login.html";
      } else {
        fetchScholars();
      }
    });

    async function fetchScholars() {
      const scholarsList = document.getElementById('scholarsList');
      const scholarCount = document.getElementById('scholarCount');
      
      try {
        // Get leaderboard as initial list of active players
        const lbSnap = await db.ref('leaderboard_quests').orderByChild('coins').get();
        if (!lbSnap.exists()) {
          scholarsList.innerHTML = '<tr><td colspan="5" class="text-center">No scholars found yet.</td></tr>';
          return;
        }

        const uids = [];
        lbSnap.forEach(child => {
          uids.push(child.key);
        });
        uids.reverse(); // Highest coins first
        
        scholarCount.innerText = uids.length;
        scholarsList.innerHTML = '';

        for (const uid of uids) {
          const progSnap = await db.ref(`users/${uid}/quest_progress`).get();
          const cardsSnap = await db.ref(`users/${uid}/quest_cards`).get();
          
          if (progSnap.exists()) {
            const prog = progSnap.val();
            const cards = cardsSnap.val() || [];
            const isGuest = uid.startsWith('guest_');
            const displayName = (await db.ref(`leaderboard_quests/${uid}/displayName`).get()).val() || "Unknown Scholar";

            const row = document.createElement('tr');
            
            // Format cards
            let cardsHtml = '';
            if (cards.length > 0) {
              cards.forEach(c => {
                const title = c.replace('card_level_', 'L');
                cardsHtml += `<span class="card-badge">${title}</span>`;
              });
            } else {
              cardsHtml = '<span style="color:#666; font-size:0.8rem;">None</span>';
            }

            row.innerHTML = `
              <td>
                <div class="d-flex align-items-center">
                  <i class="fa-solid fa-user-graduate me-2" style="color: ${isGuest ? '#e67e22' : '#3498db'};"></i>
                  <div>
                    <div style="font-weight:bold;">${displayName}${isGuest ? '<span class="guest-marker">GUEST</span>' : ''}</div>
                    <div style="font-size:0.7rem; color:#888;">${uid}</div>
                  </div>
                </div>
              </td>
              <td class="stat-val"><i class="fa-solid fa-coins me-1"></i>${prog.coins || 0}</td>
              <td>${prog.xp || 0} XP</td>
              <td style="max-width:300px;">${cardsHtml}</td>
              <td style="font-size:0.85rem; color:#aaa;">${prog.last_active || 'N/A'}</td>
            `;
            scholarsList.appendChild(row);
          }
        }
      } catch (e) {
        console.error(e);
        scholarsList.innerHTML = `<tr><td colspan="5" class="text-center text-danger">Error: ${e.message}</td></tr>`;
      }
    }
  </script>

  <script src="../js/global-animations.js"></script>
</body>
</html>
