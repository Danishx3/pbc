<!DOCTYPE html>
<html lang="en">

<head>
  <title>ILMIFY Admin – Banner Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="../pbc.css">
  <link rel="icon" href="../logoo.png" type="image/icon type">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Anek Latin', sans-serif; }

    body { background: #000915; color: #fff; min-height: 100vh; }

    .page-wrap { max-width: 700px; margin: 0 auto; padding: 80px 16px 60px; }

    .page-title {
      font-size: 1.4rem; font-weight: 700; color: #a8f0e8;
      margin-bottom: 6px;
    }

    .page-sub { font-size: 0.85rem; color: #5a7a76; margin-bottom: 28px; }

    /* Live preview */
    .banner-preview-wrap {
      position: relative; width: 100%;
      padding-top: calc(5 / 12 * 100%);
      border-radius: 16px; overflow: hidden;
      background: rgba(13,86,79,0.1);
      border: 1px solid rgba(13,86,79,0.35);
      margin-bottom: 28px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35);
    }

    .banner-preview-inner {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
    }

    .banner-preview-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.1) 60%, transparent 100%);
      display: flex; flex-direction: column;
      justify-content: center; padding: 18px 22px; gap: 8px;
    }

    .prev-tag { font-size: 0.62rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #a8f0e8; }
    .prev-title { font-size: 1.1rem; font-weight: 700; color: #fff; line-height: 1.25; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
    .prev-desc { font-size: 0.72rem; color: rgba(255,255,255,0.75); }
    .prev-btn {
      display: inline-block; padding: 7px 18px; margin-top: 4px;
      background: linear-gradient(135deg, #0d564f, #1a7a70);
      color: #fff; font-size: 0.75rem; font-weight: 700;
      border-radius: 30px; border: none; align-self: flex-start;
    }

    /* Form card */
    .form-card {
      background: rgba(13,86,79,0.1);
      border: 1px solid rgba(13,86,79,0.35);
      border-radius: 20px; padding: 24px; margin-bottom: 24px;
    }

    .form-card h4 { font-size: 1rem; font-weight: 700; color: #a8f0e8; margin-bottom: 18px; }

    label { font-size: 0.8rem; color: #a0b8b5; display: block; margin-bottom: 5px; }

    input[type="text"], input[type="url"], select, textarea {
      width: 100%; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(13,86,79,0.45);
      color: #fff; border-radius: 10px;
      padding: 10px 14px; font-size: 0.88rem;
      font-family: inherit; outline: none;
      transition: border-color 0.2s;
      margin-bottom: 14px;
    }

    input:focus, select:focus, textarea:focus { border-color: #1a7a70; }
    select option { background: #000915; }
    textarea { resize: vertical; min-height: 60px; }

    /* ImgBB Upload Zone */
    .upload-zone {
      border: 2px dashed rgba(13,86,79,0.5);
      border-radius: 14px;
      padding: 18px 16px;
      margin-bottom: 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.25s, background 0.25s;
      position: relative;
      overflow: hidden;
    }
    .upload-zone:hover { border-color: #1a7a70; background: rgba(13,86,79,0.08); }
    .upload-zone.dragging { border-color: #a8f0e8; background: rgba(13,86,79,0.15); }

    .upload-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      width: 100%; height: 100%; margin: 0; border: none; padding: 0;
    }

    .uz-icon { font-size: 1.8rem; color: #1a7a70; margin-bottom: 6px; }
    .uz-text { font-size: 0.82rem; color: #a0b8b5; }
    .uz-text strong { color: #a8f0e8; }

    .upload-progress {
      display: none;
      align-items: center; gap: 10px;
      padding: 10px 14px;
      background: rgba(13,86,79,0.12);
      border: 1px solid rgba(13,86,79,0.3);
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 0.82rem; color: #a8f0e8;
    }
    .upload-progress.show { display: flex; }

    .upload-thumb {
      width: 100%; height: 70px;
      border-radius: 10px;
      background-size: cover; background-position: center;
      background-color: rgba(13,86,79,0.2);
      border: 1px solid rgba(13,86,79,0.3);
      margin-bottom: 14px;
      display: none;
      position: relative;
    }
    .upload-thumb.show { display: block; }
    .upload-thumb-clear {
      position: absolute; top: 6px; right: 6px;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(0,0,0,0.6); border: none; color: #fff;
      font-size: 0.7rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }

    .toggle-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }

    .toggle-row label { margin-bottom: 0; }

    /* Toggle switch */
    .switch { position: relative; width: 46px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: rgba(255,255,255,0.1); border-radius: 24px;
      transition: background 0.3s;
    }
    .slider:before {
      content: ''; position: absolute;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff; top: 3px; left: 3px;
      transition: transform 0.3s;
    }
    input:checked + .slider { background: #1a7a70; }
    input:checked + .slider:before { transform: translateX(22px); }

    /* Buttons */
    .btn-save {
      background: linear-gradient(135deg, #0d564f, #1a7a70);
      color: #fff; border: none; border-radius: 30px;
      padding: 12px 36px; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 14px rgba(13,86,79,0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(13,86,79,0.7); }

    .btn-cancel {
      background: rgba(255,255,255,0.06); color: #a0b8b5;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 30px;
      padding: 12px 24px; font-size: 0.95rem; cursor: pointer;
      margin-left: 10px; transition: background 0.2s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); }

    /* Slides list */
    .slide-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }

    .slide-item {
      background: rgba(13,86,79,0.1);
      border: 1px solid rgba(13,86,79,0.3);
      border-radius: 14px; padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
    }

    .slide-thumb {
      width: 64px; height: 27px; /* 12:5 mini */
      border-radius: 6px; background-size: cover; background-position: center;
      background-color: rgba(13,86,79,0.3); flex-shrink: 0;
      border: 1px solid rgba(13,86,79,0.3);
    }

    .slide-info { flex: 1; min-width: 0; }
    .slide-info .si-title { font-weight: 700; font-size: 0.9rem; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slide-info .si-link { font-size: 0.72rem; color: #5a7a76; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .slide-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn-icon {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid rgba(13,86,79,0.4);
      background: rgba(13,86,79,0.15); color: #a8f0e8;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 0.8rem; transition: background 0.2s;
    }
    .btn-icon:hover { background: rgba(13,86,79,0.4); }
    .btn-icon.del { border-color: rgba(231,76,60,0.4); color: #ff8a80; }
    .btn-icon.del:hover { background: rgba(231,76,60,0.2); }

    .inactive-badge {
      font-size: 0.62rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: #ff8a80;
      background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3);
      padding: 2px 8px; border-radius: 20px; margin-left: 6px;
    }

    .empty-state {
      text-align: center; color: #5a7a76;
      padding: 30px 0; font-size: 0.9rem;
    }

    .toast-msg {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #0d564f, #1a7a70);
      color: #fff; padding: 10px 24px; border-radius: 30px;
      font-size: 0.85rem; font-weight: 600; z-index: 9999;
      box-shadow: 0 6px 20px rgba(13,86,79,0.5);
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .toast-msg.show { opacity: 1; }

    /* Nav */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      background: rgba(0,9,21,0.9); backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(13,86,79,0.4);
      padding: 14px 20px; display: flex; align-items: center; gap: 14px;
    }
    .top-nav a { color: #a8f0e8; text-decoration: none; font-size: 1.2rem; }
    .top-nav span { font-weight: 700; font-size: 1rem; color: #fff; }

    @media (max-width: 480px) {
      .page-wrap { padding-top: 70px; }
    }
  </style>
<script src="/theme.js"></script>
</head>

<body>
  <div class="top-nav">
    <a href="admin.html"><i class="fas fa-arrow-left"></i></a>
    <span>Banner Manager</span>
  </div>

  <div class="page-wrap">
    <div class="page-title"><i class="fas fa-images" style="margin-right:8px;"></i>Banner Slides</div>
    <div class="page-sub">Manage the sliding banner on the home page. Changes apply instantly.</div>

    <!-- Live Preview -->
    <div id="livePreviewWrap" class="banner-preview-wrap">
      <div class="banner-preview-inner" id="livePreviewBg" style="background: linear-gradient(135deg,#0d564f,#1a7a70);">
        <div class="banner-preview-overlay" id="livePreviewOverlay">
          <span class="prev-tag" id="prevTag" style="display:none;"></span>
          <div class="prev-title" id="prevTitle">Banner Preview</div>
          <div class="prev-desc" id="prevDesc" style="display:none;"></div>
          <button class="prev-btn" id="prevBtn" style="display:none;"></button>
        </div>
      </div>
    </div>

    <!-- Slide List -->
    <div class="form-card" style="padding:18px 16px;">
      <h4><i class="fas fa-layer-group" style="margin-right:8px;"></i>Current Slides</h4>
      <div class="slide-list" id="slideList">
        <div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
      </div>
      <button class="btn-save" style="width:100%; border-radius:14px;" onclick="openAddForm()">
        <i class="fas fa-plus" style="margin-right:8px;"></i>Add New Slide
      </button>
    </div>

    <!-- Add / Edit Form -->
    <div class="form-card" id="slideForm" style="display:none;">
      <h4 id="formTitle"><i class="fas fa-plus-circle" style="margin-right:8px;"></i>Add Slide</h4>

      <label>Banner Image</label>

      <!-- Upload Zone -->
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fImageFile" accept="image/*" onchange="handleImageFile(this)">
        <div class="uz-icon"><i class="fas fa-cloud-upload-alt"></i></div>
        <div class="uz-text"><strong>Click to upload</strong> or drag & drop<br>
          <span style="font-size:0.75rem;color:#5a7a76;">JPG, PNG, WEBP – max 32 MB</span>
        </div>
      </div>

      <!-- Upload progress -->
      <div class="upload-progress" id="uploadProgress">
        <i class="fas fa-spinner fa-spin"></i>
        <span id="uploadProgressText">Uploading to ImgBB...</span>
      </div>

      <!-- Uploaded thumbnail -->
      <div class="upload-thumb" id="uploadThumb">
        <button class="upload-thumb-clear" onclick="clearImage()" title="Remove image">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <label>Or paste Image URL directly</label>
      <input type="url" id="fImage" placeholder="https://i.ibb.co/..." oninput="updatePreview()">

      <label>Tag / Label <span style="color:#5a7a76;">(small text above title, e.g. LIVE NOW)</span></label>
      <input type="text" id="fTag" placeholder="LIVE NOW" maxlength="30" oninput="updatePreview()">

      <label>Title</label>
      <input type="text" id="fTitle" placeholder="Madinah Book Session" maxlength="60" oninput="updatePreview()">

      <label>Description <span style="color:#5a7a76;">(optional)</span></label>
      <textarea id="fDesc" placeholder="Short description..." maxlength="120" oninput="updatePreview()"></textarea>

      <label>Redirect Link <span style="color:#5a7a76;">(URL or relative path where clicking takes the user)</span></label>
      <input type="text" id="fLink" placeholder="/level1/madeena.html" oninput="updatePreview()">

      <label>Button Text <span style="color:#5a7a76;">(leave blank to make the whole slide clickable)</span></label>
      <input type="text" id="fBtnText" placeholder="Join Now" maxlength="30" oninput="updatePreview()">

      <label>Display Order <span style="color:#5a7a76;">(lower number = shown first)</span></label>
      <input type="text" id="fOrder" placeholder="1" style="width:100px;">

      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="fActive" checked>
          <span class="slider"></span>
        </label>
        <label for="fActive" style="color:#e2e8f0;">Slide Active (visible on homepage)</label>
      </div>

      <div style="display:flex; gap:0; flex-wrap:wrap; margin-top:4px;">
        <button class="btn-save" id="formSaveBtn" onclick="saveSlide()">
          <i class="fas fa-save" style="margin-right:8px;"></i>Save Slide
        </button>
        <button class="btn-cancel" onclick="closeForm()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-msg" id="toast"></div>

  <script>
    const auth = window.firebaseAuth || firebase.auth();
    const db = window.firebaseDb || firebase.database();

    let editKey = null;
    let allSlides = {};

    // Auth guard
    auth.onAuthStateChanged(user => {
      if (!user || user.email !== 'piousbrotherscommunity@gmail.com') {
        window.location.href = '../login.html';
      } else {
        loadSlides();
      }
    });

    // Load slides from Firebase
    function loadSlides() {
      db.ref('banners').orderByChild('order').on('value', snap => {
        allSlides = {};
        const list = document.getElementById('slideList');
        list.innerHTML = '';

        if (!snap.exists()) {
          list.innerHTML = '<div class="empty-state"><i class="fas fa-image" style="font-size:2rem;opacity:0.3;display:block;margin-bottom:8px;"></i>No slides yet. Add your first slide!</div>';
          return;
        }

        snap.forEach(child => {
          allSlides[child.key] = child.val();
          list.appendChild(buildSlideItem(child.key, child.val()));
        });
      });
    }

    function buildSlideItem(key, data) {
      const el = document.createElement('div');
      el.className = 'slide-item';

      const thumb = document.createElement('div');
      thumb.className = 'slide-thumb';
      if (data.image) thumb.style.backgroundImage = `url('${data.image}')`;

      const info = document.createElement('div');
      info.className = 'slide-info';
      info.innerHTML = `
        <div class="si-title">
          ${data.title || 'Untitled'}
          ${data.active === false ? '<span class="inactive-badge">Hidden</span>' : ''}
        </div>
        <div class="si-link">${data.link || '—'}</div>
      `;

      const actions = document.createElement('div');
      actions.className = 'slide-actions';

      const editBtn = document.createElement('button');
      editBtn.className = 'btn-icon';
      editBtn.title = 'Edit';
      editBtn.innerHTML = '<i class="fas fa-pen"></i>';
      editBtn.onclick = () => openEditForm(key, data);

      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'btn-icon';
      toggleBtn.title = data.active === false ? 'Activate' : 'Deactivate';
      toggleBtn.innerHTML = data.active === false
        ? '<i class="fas fa-eye"></i>'
        : '<i class="fas fa-eye-slash"></i>';
      toggleBtn.onclick = () => toggleActive(key, data);

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-icon del';
      delBtn.title = 'Delete';
      delBtn.innerHTML = '<i class="fas fa-trash"></i>';
      delBtn.onclick = () => deleteSlide(key);

      actions.appendChild(editBtn);
      actions.appendChild(toggleBtn);
      actions.appendChild(delBtn);

      el.appendChild(thumb);
      el.appendChild(info);
      el.appendChild(actions);
      return el;
    }

    // Preview
    function updatePreview() {
      const image = document.getElementById('fImage').value.trim();
      const tag = document.getElementById('fTag').value.trim();
      const title = document.getElementById('fTitle').value.trim();
      const desc = document.getElementById('fDesc').value.trim();
      const btnText = document.getElementById('fBtnText').value.trim();

      const bg = document.getElementById('livePreviewBg');
      bg.style.backgroundImage = image ? `url('${image}')` : '';
      bg.style.background = image ? '' : 'linear-gradient(135deg,#0d564f,#1a7a70)';

      const tagEl = document.getElementById('prevTag');
      tagEl.textContent = tag;
      tagEl.style.display = tag ? '' : 'none';

      document.getElementById('prevTitle').textContent = title || 'Banner Preview';

      const descEl = document.getElementById('prevDesc');
      descEl.textContent = desc;
      descEl.style.display = desc ? '' : 'none';

      const btnEl = document.getElementById('prevBtn');
      btnEl.textContent = btnText;
      btnEl.style.display = btnText ? '' : 'none';
    }

    function openAddForm() {
      editKey = null;
      document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle" style="margin-right:8px;"></i>Add Slide';
      document.getElementById('fImage').value = '';
      document.getElementById('fTag').value = '';
      document.getElementById('fTitle').value = '';
      document.getElementById('fDesc').value = '';
      document.getElementById('fLink').value = '';
      document.getElementById('fBtnText').value = '';
      document.getElementById('fOrder').value = Object.keys(allSlides).length + 1;
      document.getElementById('fActive').checked = true;
      resetUploadUI();
      updatePreview();
      document.getElementById('slideForm').style.display = '';
      document.getElementById('slideForm').scrollIntoView({ behavior: 'smooth' });
    }

    function openEditForm(key, data) {
      editKey = key;
      document.getElementById('formTitle').innerHTML = '<i class="fas fa-pen" style="margin-right:8px;"></i>Edit Slide';
      document.getElementById('fImage').value = data.image || '';
      document.getElementById('fTag').value = data.tag || '';
      document.getElementById('fTitle').value = data.title || '';
      document.getElementById('fDesc').value = data.desc || '';
      document.getElementById('fLink').value = data.link || '';
      document.getElementById('fBtnText').value = data.btnText || '';
      document.getElementById('fOrder').value = data.order !== undefined ? data.order : 1;
      document.getElementById('fActive').checked = data.active !== false;
      resetUploadUI();
      // Show existing image as thumbnail
      if (data.image) {
        const thumb = document.getElementById('uploadThumb');
        thumb.style.backgroundImage = `url('${data.image}')`;
        thumb.classList.add('show');
      }
      updatePreview();
      document.getElementById('slideForm').style.display = '';
      document.getElementById('slideForm').scrollIntoView({ behavior: 'smooth' });
    }

    function closeForm() {
      document.getElementById('slideForm').style.display = 'none';
      editKey = null;
    }

    function saveSlide() {
      const title = document.getElementById('fTitle').value.trim();
      if (!title) { showToast('Title is required!'); return; }

      const payload = {
        image: document.getElementById('fImage').value.trim(),
        tag: document.getElementById('fTag').value.trim(),
        title,
        desc: document.getElementById('fDesc').value.trim(),
        link: document.getElementById('fLink').value.trim(),
        btnText: document.getElementById('fBtnText').value.trim(),
        order: parseInt(document.getElementById('fOrder').value) || 1,
        active: document.getElementById('fActive').checked,
        updatedAt: Date.now()
      };

      const ref = editKey
        ? db.ref('banners/' + editKey)
        : db.ref('banners').push();

      ref.set(payload).then(() => {
        showToast(editKey ? 'Slide updated!' : 'Slide added!');
        closeForm();
      }).catch(e => showToast('Error: ' + e.message));
    }

    function deleteSlide(key) {
      if (!confirm('Delete this slide?')) return;
      db.ref('banners/' + key).remove().then(() => showToast('Slide deleted.'));
    }

    function toggleActive(key, data) {
      db.ref('banners/' + key).update({ active: data.active === false })
        .then(() => showToast(data.active === false ? 'Slide activated.' : 'Slide hidden.'));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ── ImgBB Upload ──────────────────────────────────────────
    const IMGBB_KEY = 'fc2a11d6d841cc2f84e6d2009864f9aa';

    function handleImageFile(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      if (file.size > 32 * 1024 * 1024) {
        showToast('File too large! Max 32 MB.');
        return;
      }
      uploadToImgBB(file);
    }

    // Drag-and-drop support
    const uploadZone = document.getElementById('uploadZone');
    uploadZone.addEventListener('dragover', e => {
      e.preventDefault();
      uploadZone.classList.add('dragging');
    });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragging'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('dragging');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) uploadToImgBB(file);
    });

    async function uploadToImgBB(file) {
      const progress = document.getElementById('uploadProgress');
      const progressText = document.getElementById('uploadProgressText');
      const thumb = document.getElementById('uploadThumb');

      // Show progress
      progress.classList.add('show');
      progressText.textContent = 'Uploading to ImgBB...';
      thumb.classList.remove('show');

      try {
        const formData = new FormData();
        formData.append('image', file);

        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
          method: 'POST',
          body: formData
        });

        const json = await res.json();

        if (json.success) {
          const url = json.data.display_url;
          document.getElementById('fImage').value = url;

          // Show thumbnail
          thumb.style.backgroundImage = `url('${url}')`;
          thumb.classList.add('show');
          progress.classList.remove('show');

          updatePreview();
          showToast('Image uploaded successfully!');
        } else {
          progress.classList.remove('show');
          showToast('Upload failed: ' + (json.error?.message || 'Unknown error'));
        }
      } catch (err) {
        progress.classList.remove('show');
        showToast('Upload error: ' + err.message);
      }
    }

    function clearImage() {
      document.getElementById('fImage').value = '';
      document.getElementById('fImageFile').value = '';
      document.getElementById('uploadThumb').classList.remove('show');
      document.getElementById('uploadThumb').style.backgroundImage = '';
      updatePreview();
    }

    // Reset upload UI when form opens/closes
    function resetUploadUI() {
      document.getElementById('fImageFile').value = '';
      document.getElementById('uploadProgress').classList.remove('show');
      document.getElementById('uploadThumb').classList.remove('show');
      document.getElementById('uploadThumb').style.backgroundImage = '';
    }
    // ─────────────────────────────────────────────────────────
  </script>

  <script src="../js/global-animations.js"></script>
</body>

</html>
